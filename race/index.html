<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#051C54">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Math Games">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="apple-touch-icon" href="../icon-180.png">
<link rel="icon" href="../icon-192.png">
<script>window.HUB_URL = "../";</script>
<title>Team Race</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
/* ================= shared look for every game (night-sky navy + gold) ================= */
:root{
  --deep:#020B26; --stage:#051C54; --panel:#0E2C74; --silver:#C9D3EA; --muted:#8C9AC0;
  --gold:#FCA500; --gold-dark:#8A5A00; --green:#2F9E6E; --green-hi:#3DC48A; --coral:#ED4667; --teal:#108CB5; --ink:#051C54;
  --display:"Arial Rounded MT Bold","Nunito","Segoe UI",sans-serif;
  --body:"Segoe UI","Nunito",Tahoma,sans-serif;
  --cut:clamp(12px,1.6vw,24px);
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--deep);color:#fff;font-family:var(--body);overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.app{position:relative;min-height:100%;display:flex;flex-direction:column;
  background:radial-gradient(ellipse 70% 75% at 40% 30%,#1B3F8F 0%,#0A2466 38%,var(--stage) 68%,var(--deep) 100%);
  padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
.rays{position:absolute;inset:0;pointer-events:none;background:repeating-conic-gradient(from 0deg at 40% 30%,rgba(255,255,255,.035) 0 6deg,transparent 6deg 14deg)}
.screen{position:relative;flex:1;display:flex;flex-direction:column;gap:clamp(10px,1.6vw,20px);max-width:1400px;width:100%;margin:0 auto;box-sizing:border-box;padding-block:clamp(10px,1.6vw,22px) 24px;padding-inline:16px}

/* top bar */
.topbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;min-height:46px;padding-left:58px}
.menu-btn{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);left:calc(env(safe-area-inset-left,0px) + 14px);z-index:25;width:46px;height:46px;border-radius:12px;border:1.5px solid rgba(201,211,234,.6);background:rgba(2,11,38,.7);display:grid;place-items:center;padding:0;flex:none}
.menu-btn:hover{border-color:var(--gold)}
.menu-btn svg{width:24px;height:24px}
.chip{border:2px solid var(--gold);color:var(--gold);border-radius:99px;padding:4px 14px;font-family:var(--display);font-size:clamp(13px,1.2vw,17px);white-space:nowrap}
.chip.solid{background:var(--gold);color:var(--ink)}
.spacer{flex:1}
.icon-btn{background:rgba(2,11,38,.55);border:1.5px solid rgba(201,211,234,.5);border-radius:10px;padding:6px 12px;font-size:14px}
.icon-btn:hover{border-color:var(--gold)}

/* headings */
.kicker{font-family:var(--display);letter-spacing:.3em;color:var(--silver);font-size:clamp(13px,1.6vw,22px);text-align:center}
.logo-type{font-family:var(--display);font-size:clamp(38px,7.5vw,104px);line-height:1;color:var(--gold);text-shadow:0 .06em 0 var(--gold-dark),0 0 .5em rgba(252,165,0,.45);margin:0;text-align:center;text-wrap:balance}
.sub{color:var(--silver);font-size:clamp(14px,1.5vw,20px);max-width:62ch;text-align:center;margin:0 auto;line-height:1.5}
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(12px,1.8vw,24px)}
.card{background:rgba(2,11,38,.6);border:1.5px solid rgba(201,211,234,.4);border-radius:16px;padding:clamp(14px,2vw,24px);width:min(900px,100%);box-sizing:border-box}
.card h2{font-family:var(--display);color:var(--gold);font-size:clamp(16px,1.5vw,21px);margin:0 0 10px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:6px 0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:clamp(14px,2vw,26px)}
.lsum{display:flex;align-items:center;gap:8px;flex-wrap:wrap;color:var(--silver);font-size:14px;line-height:1.5}
input[type=text]{background:var(--stage);border:1.5px solid rgba(201,211,234,.5);border-radius:8px;color:#fff;padding:7px 10px;font:inherit;min-width:0;width:100%;box-sizing:border-box}
select{background:var(--stage);border:1.5px solid rgba(201,211,234,.5);border-radius:8px;color:#fff;padding:6px 8px;font:inherit}
label.chk{display:flex;gap:8px;align-items:flex-start;padding:4px 0;cursor:pointer;line-height:1.35}
label.chk input{margin-top:3px;accent-color:var(--gold);width:17px;height:17px;flex:none}
.seg{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.seg button{text-align:left;border:2px solid rgba(201,211,234,.4);background:rgba(2,11,38,.45);border-radius:14px;padding:10px 14px;display:flex;flex-direction:column;gap:3px}
.seg button b{font-family:var(--display);font-size:17px}
.seg button span{font-size:13px;color:var(--silver);line-height:1.4}
.seg button[aria-pressed="true"]{border-color:var(--gold);background:rgba(252,165,0,.14)}
.seg button[aria-pressed="true"] b{color:var(--gold)}

/* buttons */
.btn{font-family:var(--display);font-size:clamp(15px,1.4vw,21px);border-radius:99px;padding:.6em 1.6em;border:2px solid var(--gold);background:var(--gold);color:var(--ink)}
.btn:hover:not(:disabled){filter:brightness(1.1)}
.btn:disabled{opacity:.35;cursor:default}
.btn.ghost{background:transparent;color:var(--gold)}
.btn.green{background:var(--green);border-color:var(--green-hi);color:#fff}
.bar{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;align-items:center}

/* question + answers */
.lz{position:relative;clip-path:polygon(var(--cut) 0,calc(100% - var(--cut)) 0,100% 50%,calc(100% - var(--cut)) 100%,var(--cut) 100%,0 50%);background:linear-gradient(var(--silver),#8FA0C8);padding:3px}
.lz>.in{clip-path:inherit;background:linear-gradient(#123480,var(--stage) 60%,#03133E);display:flex;align-items:center;padding:clamp(8px,1vw,16px) calc(var(--cut) + 14px);min-height:100%;box-sizing:border-box}
.q .in{flex-direction:column;justify-content:center;text-align:center;font-family:var(--display);font-size:clamp(18px,2.3vw,36px);line-height:1.35;min-height:clamp(90px,10vw,160px);text-wrap:balance}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:clamp(8px,1vw,14px) clamp(10px,1.4vw,22px)}
.opt{border:0;padding:3px;text-align:left}
.opt .in{font-family:var(--display);font-size:clamp(15px,1.8vw,28px);min-height:clamp(50px,5vw,76px);gap:.6em;font-variant-numeric:tabular-nums;line-height:1.25}
.opt .let{color:var(--gold)}
.opt:hover:not(:disabled) .in{background:linear-gradient(#1C46A3,#0A2466)}
.opt:disabled{cursor:default}
.opt.right{background:#E8FFF2}.opt.right .in{background:linear-gradient(var(--green-hi),var(--green) 60%,#1F7A52);color:#fff}.opt.right .let{color:#fff}
.opt.wrong{background:#FFD0DA}.opt.wrong .in{background:linear-gradient(#F26A86,var(--coral) 60%,#B8264A);color:#fff}.opt.wrong .let{color:#fff}
.opt.pick{background:#FFE7B0}.opt.pick .in{background:linear-gradient(#FFB733,#E48F00);color:var(--ink)}.opt.pick .let{color:var(--ink)}
.explain{background:rgba(2,11,38,.68);border-left:6px solid var(--green);border-radius:10px;padding:12px 18px;font-size:clamp(14px,1.35vw,20px);line-height:1.55}
.explain.bad{border-left-color:var(--coral)}
.explain b.ok{color:var(--green-hi)} .explain b.no{color:#FF8FA6}
.why{display:flex;flex-direction:column;gap:2px;margin-bottom:8px}
.steps-more summary{cursor:pointer;color:var(--gold);font-family:var(--display);font-size:.9em}
.steps-more ol{margin:6px 0 0;padding-left:1.4em;line-height:1.55;font-size:.92em;color:var(--silver)}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;font-size:.72em;line-height:1.05;margin:0 .12em}
.fr>span:first-child{border-bottom:.12em solid currentColor;padding:0 .2em}
.qfig{display:block;margin:.4em auto 0;height:clamp(90px,13vw,170px);width:auto;max-width:100%}

/* drawer menu */
.scrim{position:fixed;inset:0;background:rgba(2,11,38,.6);z-index:39}
.drawer{position:fixed;top:0;bottom:0;left:0;width:min(360px,88vw);z-index:40;background:var(--stage);border-right:2px solid rgba(201,211,234,.5);
  padding:calc(env(safe-area-inset-top,0px) + 16px) 16px 20px;box-sizing:border-box;overflow-y:auto;display:flex;flex-direction:column;gap:6px;box-shadow:8px 0 30px rgba(0,0,0,.5)}
.drawer-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.drawer-head b{font-family:var(--display);color:var(--gold);font-size:22px}
.x{width:38px;height:38px;border-radius:10px;border:1.5px solid rgba(201,211,234,.5);background:transparent;font-size:22px;line-height:1}
.mitem{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:rgba(2,11,38,.45);border:1.5px solid transparent;border-radius:12px;padding:12px 14px;font-family:var(--display);font-size:16px;box-sizing:border-box;text-decoration:none;color:#fff}
.mitem:hover{border-color:rgba(252,165,0,.6)}
.mitem small{font-family:var(--body);color:var(--muted);font-size:12px;margin-left:auto}
.mitem:disabled{opacity:.5;cursor:default}
.mitem:disabled:hover{border-color:transparent}
.mitem.on{border-color:rgba(252,165,0,.6)}
.mitem .dot{width:9px;height:9px;border-radius:50%;background:var(--gold);flex:none}
.mitem.home{color:var(--gold)}
.mgroup{font-family:var(--display);color:var(--muted);font-size:12px;letter-spacing:.12em;margin:12px 4px 2px}
.lessons{background:rgba(2,11,38,.45);border-radius:12px;padding:8px 12px;margin-left:12px}
.lessons .row{justify-content:space-between;margin:0 0 4px}
.lessons .link{background:none;border:0;color:var(--gold);font-size:13px;padding:2px 4px;text-decoration:underline}
.lessons label.chk{font-size:14px}
.tag{display:inline-block;font-family:var(--display);background:var(--teal);border-radius:6px;padding:0 6px;margin-right:4px;font-size:.85em;color:#fff}
.mnote{color:var(--muted);font-size:12px;margin:4px 2px 0 14px;line-height:1.4}

.overlay{position:fixed;inset:0;background:rgba(2,11,38,.82);display:grid;place-items:center;padding:16px;z-index:30}
.modal{background:var(--stage);border:2px solid var(--silver);border-radius:18px;padding:clamp(16px,2.4vw,30px);width:min(640px,100%);box-sizing:border-box;text-align:center;max-height:calc(100vh - 32px);overflow-y:auto}
.modal h3{font-family:var(--display);color:var(--gold);font-size:clamp(20px,2.2vw,28px);margin:0 0 8px}
.big{font-family:var(--display);font-size:clamp(34px,6vw,84px);color:var(--gold);font-variant-numeric:tabular-nums;line-height:1}
canvas.confetti{position:fixed;inset:0;pointer-events:none;z-index:50}

@media (max-width:820px){ .grid2{grid-template-columns:1fr} }
@media (max-width:540px){ .opts{grid-template-columns:1fr} }
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* lesson / skill choice */
.seg2{display:grid;grid-template-columns:1fr 1fr;border:1.5px solid rgba(201,211,234,.45);border-radius:99px;overflow:hidden;margin:2px 0 8px}
.seg2 button{background:transparent;border:0;padding:6px 8px;font-family:var(--display);font-size:13px}
.seg2 button[aria-pressed="true"]{background:var(--gold);color:var(--ink)}
.lessons .topic{font-family:var(--display);color:var(--gold);font-size:12px;letter-spacing:.06em;margin:8px 0 2px;text-transform:uppercase}
.lessons .lref{color:var(--muted);font-size:11px;margin-left:4px}
.mwho{color:var(--silver);font-size:13px;margin:2px 4px 4px}
.mwho b{color:var(--gold)}

/* Team Race: a lane per team across the top (the race is the picture), the question underneath. */
.track{background:rgba(2,11,38,.6);border:1.5px solid rgba(201,211,234,.35);border-radius:16px;padding:10px 14px;display:flex;flex-direction:column;gap:8px}
.lane{display:grid;grid-template-columns:clamp(84px,11vw,150px) 1fr;align-items:center;gap:10px}
.lane .name{font-family:var(--display);font-size:clamp(13px,1.3vw,18px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:6px}
.lane .name i{width:12px;height:12px;border-radius:50%;flex:none}
.road{position:relative;height:clamp(38px,4.6vw,56px);border-radius:10px;background:#0A1A44;overflow:hidden}
.road:before{content:"";position:absolute;left:0;right:0;top:50%;height:3px;margin-top:-1.5px;background:repeating-linear-gradient(90deg,rgba(201,211,234,.45) 0 12px,transparent 12px 22px)}
.road.moving:before{animation:dash .3s linear infinite}
@keyframes dash{to{background-position:-22px 0}}
.road .ticks{position:absolute;inset:0;display:flex}
.road .ticks span{flex:1;border-right:1px solid rgba(201,211,234,.12)}
.road .flag{position:absolute;right:0;top:0;bottom:0;width:18px;background:repeating-conic-gradient(#fff 0 25%,#051C54 0 50%) 0 0/9px 9px}
.car{position:absolute;top:50%;width:clamp(50px,5.4vw,74px);transform:translate(-2%,-50%);transition:left .7s cubic-bezier(.3,1.4,.5,1)}
.car svg{display:block;width:100%;height:auto;position:relative}
.car .wheel{transform-box:fill-box;transform-origin:center}
.car.moving .wheel{animation:spin .22s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.car svg{animation:idle .3s ease-in-out infinite alternate}
@keyframes idle{to{transform:translateY(-1px)}}
.car .trail{position:absolute;right:92%;top:22%;width:48px;height:56%;opacity:0;transition:opacity .2s;
  background:repeating-linear-gradient(180deg,rgba(255,255,255,.75) 0 2px,transparent 2px 7px);-webkit-mask-image:linear-gradient(90deg,transparent,#000);mask-image:linear-gradient(90deg,transparent,#000)}
.car.moving .trail{opacity:1;animation:trail .25s linear infinite}
@keyframes trail{from{transform:translateX(10px)}to{transform:translateX(-10px)}}
.car .flame{position:absolute;right:96%;top:50%;width:22px;height:12px;margin-top:-2px;opacity:0;border-radius:50% 0 0 50%;
  background:radial-gradient(ellipse at 100% 50%,#fff 0,#FCA500 35%,#ED4667 70%,transparent 72%);transform-origin:100% 50%}
.car.boost .flame{opacity:1;animation:flame .12s ease-in-out infinite alternate}
@keyframes flame{from{transform:scaleX(.7)}to{transform:scaleX(1.25)}}
.car.lead svg{filter:drop-shadow(0 0 6px rgba(252,165,0,.85))}
.road .flag.wave{animation:wave .25s ease-in-out 6 alternate}
@keyframes wave{from{transform:skewY(-8deg)}to{transform:skewY(8deg)}}
@media (prefers-reduced-motion:reduce){.car svg,.car.moving .wheel,.car.moving .trail,.car.boost .flame,.road.moving:before,.road .flag.wave{animation:none}}
.steps{font-family:var(--display);font-size:12px;color:var(--muted);text-align:right;margin-top:-4px}
.who{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:center}
.who .t{border:2px solid rgba(201,211,234,.45);background:rgba(2,11,38,.5);border-radius:99px;padding:8px 16px;font-family:var(--display);display:flex;align-items:center;gap:8px}
.who .t i{width:12px;height:12px;border-radius:50%}
.who .t[aria-pressed="true"]{border-color:var(--green-hi);background:rgba(47,158,110,.3)}
.hint{color:var(--silver);text-align:center;font-size:clamp(13px,1.2vw,16px)}
.teams{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.teams .tn{display:flex;align-items:center;gap:8px}
.teams .tn i{width:14px;height:14px;border-radius:50%;flex:none}
.podium{display:flex;flex-direction:column;gap:6px;width:min(520px,100%)}
.podium div{display:flex;justify-content:space-between;align-items:center;background:rgba(2,11,38,.55);border-radius:10px;padding:8px 14px;font-family:var(--display)}
.podium div.first{border:2px solid var(--gold);color:var(--gold)}
@media (max-width:540px){ .teams{grid-template-columns:1fr} }
</style>
</head>
<body>

<div class="app">
  <div class="rays"></div>

  <!-- SETUP -->
  <section class="screen" id="scrSetup">
    <div class="topbar"><span class="spacer"></span></div>
    <div class="center">
      <div class="kicker">READY, SET, SOLVE</div>
      <h1 class="logo-type">TEAM RACE</h1>
      <p class="sub">Every right answer moves a car one step forward. The first car to reach the flag wins.</p>
      <div class="card">
        <div id="whereBox"><h2>Where are you playing?</h2>
        <div class="seg">
          <button id="mClass" aria-pressed="true"><b>In class</b><span>2 to 4 teams race. Everyone answers on whiteboards; you tap the teams that got it right.</span></button>
          <button id="mHome" aria-pressed="false"><b>At home</b><span>You race against the robot car. Answer right to move ahead.</span></button>
        </div></div>
        <div class="grid2" style="margin-top:16px">
          <div id="teamBox">
            <h2>Teams</h2>
            <div class="row"><label for="nTeams">Number of teams</label><select id="nTeams"><option>2</option><option>3</option><option selected>4</option></select></div>
            <div class="teams" id="teamNames"></div>
          </div>
          <div id="robotBox" hidden>
            <h2>Robot speed</h2>
            <div class="row"><select id="robot"><option value=".35">Easy robot</option><option value=".5" selected>Normal robot</option><option value=".65">Fast robot</option></select></div>
            <div class="row"><label for="pName">Your name</label></div><input type="text" id="pName" maxlength="16">
          </div>
          <div>
            <h2>Race</h2>
            <div class="lsum"><span id="lessonSum"></span><button class="btn ghost" id="btnLessons" style="font-size:13px;padding:.35em 1em">Change in the menu</button></div>
            <div class="row" style="margin-top:8px"><label for="len">Race length</label><select id="len"><option value="8">Short &#xb7; 8 steps</option><option value="12" selected>Medium &#xb7; 12 steps</option><option value="16">Long &#xb7; 16 steps</option></select></div>
          </div>
        </div>
      </div>
      <div class="bar"><button class="btn" id="btnStart">Start the race</button></div>
    </div>
  </section>

  <!-- RACE -->
  <section class="screen" id="scrRace" hidden>
    <div class="topbar"><span class="chip solid" id="qNo">Question 1</span><span class="chip" id="qLesson"></span><span class="spacer"></span></div>
    <div class="track" id="track"></div>
    <div id="qBox"></div>
    <div class="explain" id="explain" hidden></div>
    <div id="classCtl" class="bar" style="flex-direction:column;gap:10px">
      <div class="hint" id="hint">Teams solve on their whiteboards, then tap <b>Show answer</b>.</div>
      <div class="who" id="who" hidden></div>
      <div class="bar"><button class="btn" id="btnShow">Show answer</button><button class="btn green" id="btnMove" hidden>Move the cars</button></div>
    </div>
    <div class="bar"><button class="btn green" id="btnNext" hidden>Next question</button></div>
  </section>

  <!-- FINISH -->
  <section class="screen" id="scrEnd" hidden>
    <div class="topbar"><span class="spacer"></span></div>
    <div class="center">

/* ================= accounts, progress sync and usage stats (shared by the app home, every game and admin) ================= */
// Two backends with the same calls:
//   server \u2014 Supabase (window.EDU_BACKEND = { url, anonKey } from app/backend.json): works on any device, feeds the admin dashboard
//   device \u2014 localStorage only, used until the server is configured (same screens; data stays on this device)
const EDU = (() => {
  const cfg = window.EDU_BACKEND || {};
  const SERVER = !!(cfg.url && cfg.anonKey);
  const rawSet = Storage.prototype.setItem, rawRemove = Storage.prototype.removeItem;
  const get = (k, d) => { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } };
  const put = (k, v) => { try { rawSet.call(localStorage, k, JSON.stringify(v)); } catch {} };

/* ================= engine core: shared helpers for every grade ================= */
// Every question carries:
//   options/correct/explain  - the four choices and a short solution line
//   reasons[i]               - why choice i is wrong (shown after a wrong answer)
//   steps                    - thinking steps WITHOUT the answer (used by the home-mode AI helpers)
const R = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];

const cap = s => s[0].toUpperCase() + s.slice(1);
const P10 = k => 10 ** k;
const PLACE = ["ones", "tens", "hundreds", "thousands", "ten thousands", "hundred thousands", "millions"];

// A stacked fraction (never a slash): FR(1, 10)
const FR = (n, d) => `<span class="fr"><span>${n}</span><span>${d}</span></span>`;
// Decimals are kept as whole numbers of thousandths (m) to avoid floating-point errors; p = digits after the point.
const DPLACE = ["", "tenths", "hundredths", "thousandths"];
const fmtDec = (m, p) => { const w = Math.floor(m / 1000), f = m % 1000; return p ? `${fmt(w)}.${String(f).padStart(3, "0").slice(0, p)}` : fmt(w); };

const fromDigits = d => Number(d.slice().reverse().join(""));
const randN = len => R(P10(len - 1), P10(len) - 1);

const ONES = ["zero","one","two","three","four","five","six","seven","eight","nine","ten","eleven","twelve","thirteen","fourteen","fifteen","sixteen","seventeen","eighteen","nineteen"];

}

// Column-by-column working for the algorithm (used in steps and explanations).

const GRADES = {};   // GRADES[g] = { name, lessons: [[code, title]], gen: { code: tier => question } }

/* ================= Grade 4 \u00b7 Units 2\u20133 (place value, rounding, add/subtract by the algorithm) ================= */
(() => {
const G = {};   // generators by lesson: (tier) => question

/* 2-1 place value */

G["2-2"] = (t, force) => {

/* 2-3 compare */

    q.meta = { kind: "most", great, nums: nums.map(n => n[0]), ansM: ans[0] }; return q;
  }
  const up = nums.slice().sort((x, y) => x[0] - y[0]), j = s => s.map(n => fmtDec(n[0], n[1])).join(";  ");
  const perms = [[up[2], up[1], up[0]], [up[1], up[0], up[2]], [up[0], up[2], up[1]], [up[2], up[0], up[1]]];
  const whyO = s => { for (let i = 0; i < 2; i++) if (s[i][0] > s[i + 1][0]) return `Not in order: ${fmtDec(s[i][0], s[i][1])} is greater than ${fmtDec(s[i + 1][0], s[i + 1][1])}. ${why34(s[i], s[i + 1])}`; return null; };
  const q = makeQ("3-4", "Which list is ordered from <b>least to greatest</b>?", j(up), shuffle(perms).map(s => [j(s), whyO(s)]),
    `Line up the decimal points and compare place by place: ${up.map(n => fmtDec(n[0], n[1])).join(" < ")}.`,
    ["Line up the decimal points.", "Add zeros so every number has the same number of decimal places.", "Find the least, then the next, then the greatest."], v => v);
  q.meta = { kind: "order", ms: up.map(n => n[0]) }; return q;
};

/* ================= rounds ================= */
// A "pool" is what the player chose: lesson codes ("2-2") or skill ids ("2-2:wordTo"), never both.
function genFrom(grade, id, tier) {
  const [lesson, kind] = id.split(":");
  const q = GRADES[grade].gen[lesson](tier, kind);
  if (kind) q.skill = (GRADES[grade].skills.find(s => s.id === id) || {}).name;
  return q;
}
// 15 questions, easy \u2192 hard (tier 1 = Q1\u20135, 2 = Q6\u201310, 3 = Q11\u201315), nothing twice in a row when there is a choice.
function makeRound(grade, pool) {
  const qs = []; let bag = [], last = null;
  for (let i = 0; i < 15; i++) {
    if (!bag.length) bag = shuffle(pool);
    let k = bag.findIndex(l => l !== last); if (k < 0) k = 0;
    const l = bag.splice(k, 1)[0]; last = l;
    qs.push(genFrom(grade, l, i < 5 ? 1 : i < 10 ? 2 : 3));
  }
  return qs;
}
// "Switch the question" lifeline: a new question of the same level, from another lesson if possible.
function switchQuestion(grade, old, qi, pool) {
  const others = pool.filter(id => id.split(":")[0] !== old.lesson);
  return genFrom(grade, pick(others.length ? others : pool), qi < 5 ? 1 : qi < 10 ? 2 : 3);
}
// Valid pool for a grade from saved choices (drops anything the engine no longer has).
function cleanPool(grade, ids) {
  const G = GRADES[grade];
  return (ids || []).filter(id => { const [l, k] = id.split(":"); return G.gen[l] && (!k || G.skills.some(s => s.id === id)); });
}

/* ================= FX: sound effects and motion for the games (no libraries, works offline) =================
   Sound: every effect is synthesised with Web Audio (no audio files to load, license or cache). FX.play(name) follows the
   app-wide sound setting (edu_sound) and starts only after a tap, as browsers require. Each sound is a function of
   (context, output, start time), so the same code can render a preview offline (FX.render, used for the owner's videos).
   Motion: Web Animations API helpers. With "reduce motion" on, they do nothing and the game still shows the end state. */
const FX = (() => {
  const reduce = () => !!(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches);
  const soundOn = () => { try { return JSON.parse(localStorage.getItem("edu_sound") ?? "true") !== false; } catch { return true; } };

  /* ---- sound building blocks ---- */
  const noiseBufs = new WeakMap();
  function noiseBuf(c) {
    if (!noiseBufs.has(c)) { const b = c.createBuffer(1, c.sampleRate, c.sampleRate), d = b.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; noiseBufs.set(c, b); }
    return noiseBufs.get(c);
  }
  function env(g, t, a, peak, d) { g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(peak, t + a); g.gain.exponentialRampToValueAtTime(0.0001, t + a + d); }
  // a pitched note; f2 slides the pitch, lp puts it through a low-pass filter
  function tone(c, out, t, { type = "sine", f, f2, d = 0.2, a = 0.005, vol = 0.2, lp }) {
    const o = c.createOscillator(), g = c.createGain(); o.type = type; o.frequency.setValueAtTime(f, t);
    if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + a + d);
    env(g, t, a, vol, d);
    let node = o; if (lp) { const fl = c.createBiquadFilter(); fl.type = "lowpass"; fl.frequency.value = lp; o.connect(fl); node = fl; }
    node.connect(g).connect(out); o.start(t); o.stop(t + a + d + 0.05);
  }
  // filtered noise: whooshes, sparkle and crowd
  function hiss(c, out, t, { f = 1200, f2, q = 1, d = 0.3, a = 0.02, vol = 0.2, type = "bandpass" }) {
    const s = c.createBufferSource(), fl = c.createBiquadFilter(), g = c.createGain();
    s.buffer = noiseBuf(c); s.loop = true; fl.type = type; fl.Q.value = q; fl.frequency.setValueAtTime(f, t);

    env(g, t, a, vol, d); s.connect(fl).connect(g).connect(out); s.start(t); s.stop(t + a + d + 0.05);
  }

    correct: (c, o, t) => { notes(c, o, t, [[660, 0], [880, 0.07], [1320, 0.14]], { type: "triangle", d: 0.18, vol: 0.16 }); tone(c, o, t + 0.2, { f: 2640, d: 0.3, vol: 0.05 }); },
    wrong: (c, o, t) => { tone(c, o, t, { f: 320, f2: 150, d: 0.32, vol: 0.18 }); tone(c, o, t + 0.04, { type: "triangle", f: 240, f2: 120, d: 0.3, vol: 0.07 }); },
    streak: (c, o, t) => { notes(c, o, t, [[523, 0], [659, 0.05], [784, 0.1], [1047, 0.15], [1319, 0.2]], { type: "triangle", d: 0.16, vol: 0.13 }); hiss(c, o, t + 0.15, { f: 6000, q: 0.7, d: 0.5, vol: 0.05, type: "highpass" }); },
    whoosh: (c, o, t) => hiss(c, o, t, { f: 350, f2: 2600, q: 1.2, a: 0.05, d: 0.35, vol: 0.28 }),
    engine: (c, o, t) => { tone(c, o, t, { type: "sawtooth", f: 70, f2: 150, a: 0.05, d: 0.55, vol: 0.12, lp: 700 }); tone(c, o, t, { type: "square", f: 35, f2: 75, a: 0.05, d: 0.55, vol: 0.06, lp: 300 }); },
    rev: (c, o, t) => { tone(c, o, t, { type: "sawtooth", f: 55, f2: 230, a: 0.1, d: 1.0, vol: 0.13, lp: 900 }); tone(c, o, t, { type: "square", f: 28, f2: 115, a: 0.1, d: 1.0, vol: 0.06, lp: 300 }); },
    beep: (c, o, t) => tone(c, o, t, { type: "square", f: 660, d: 0.13, vol: 0.09, lp: 2500 }),
    go: (c, o, t) => { tone(c, o, t, { type: "square", f: 1320, d: 0.4, vol: 0.1, lp: 3500 }); hiss(c, o, t + 0.05, { f: 400, f2: 3000, d: 0.45, vol: 0.2 }); },
    overtake: (c, o, t) => { tone(c, o, t, { type: "triangle", f: 523, f2: 1047, d: 0.22, vol: 0.14 }); hiss(c, o, t, { f: 800, f2: 3000, d: 0.25, vol: 0.12 }); },
    stretch: (c, o, t) => notes(c, o, t, [[784, 0], [784, 0.12], [1047, 0.24]], { type: "square", d: 0.1, vol: 0.07, lp: 3000 }),
    star: (c, o, t) => { tone(c, o, t, { f: 1568, d: 0.4, vol: 0.09 }); tone(c, o, t + 0.06, { f: 2093, d: 0.45, vol: 0.07 }); },
    tick: (c, o, t) => tone(c, o, t, { type: "square", f: 1200, d: 0.03, vol: 0.04 }),
    win: (c, o, t) => {
      notes(c, o, t, [[523, 0, 0.18], [659, 0.15, 0.18], [784, 0.3, 0.18], [1047, 0.45, 0.35], [784, 0.75, 0.15], [1047, 0.9, 0.7]], { type: "triangle", vol: 0.15 });
      notes(c, o, t, [[262, 0.45, 0.5], [330, 0.9, 0.8]], { type: "sine", vol: 0.1 });
      hiss(c, o, t + 0.45, { f: 1800, q: 0.6, a: 0.2, d: 1.4, vol: 0.06 });   // the crowd
    },
  };

  /* ---- live playback (+ a log of what played, for previews) ---- */
  let AC = null, master = null;
  const log = [], T0 = performance.now();
  function live() {
    if (!AC) { AC = new (window.AudioContext || window.webkitAudioContext)(); master = AC.createGain(); master.gain.value = 0.8; master.connect(AC.destination); }
    if (AC.state === "suspended") AC.resume();
    return AC;
  }
  function play(name) {
    if (!SOUNDS[name]) return;
    log.push({ name, at: (performance.now() - T0) / 1000 });
    if (!soundOn()) return;
    try { const c = live(); SOUNDS[name](c, master, c.currentTime + 0.01); } catch {}
  }
  // render logged sounds (from second `from`, `len` seconds) offline \u2192 WAV as base64; used only to make preview videos
  async function render(from = 0, len = 10) {
    const rate = 44100, c = new OfflineAudioContext(1, Math.ceil(rate * len), rate), out = c.createGain(); out.gain.value = 0.8; out.connect(c.destination);
    log.filter(e => e.at >= from && e.at < from + len).forEach(e => SOUNDS[e.name](c, out, e.at - from + 0.01));
    const buf = await c.startRendering(), d = buf.getChannelData(0), wav = new DataView(new ArrayBuffer(44 + d.length * 2));
    const str = (o, s) => [...s].forEach((ch, i) => wav.setUint8(o + i, ch.charCodeAt(0)));
    str(0, "RIFF"); wav.setUint32(4, 36 + d.length * 2, true); str(8, "WAVEfmt "); wav.setUint32(16, 16, true); wav.setUint16(20, 1, true); wav.setUint16(22, 1, true);
    wav.setUint32(24, rate, true); wav.setUint32(28, rate * 2, true); wav.setUint16(32, 2, true); wav.setUint16(34, 16, true); str(36, "data"); wav.setUint32(40, d.length * 2, true);
    for (let i = 0; i < d.length; i++) wav.setInt16(44 + i * 2, Math.max(-1, Math.min(1, d[i])) * 0x7fff, true);
    let bin = ""; const bytes = new Uint8Array(wav.buffer); for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode(...bytes.subarray(i, i + 0x8000));
    return btoa(bin);
  }

  /* ---- motion ---- */
  let css = false;
  function ensureCss() {
    if (css) return; css = true;
    const s = document.createElement("style");
    s.textContent = `.fx-layer{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden}
.fx-float{position:fixed;transform:translate(-50%,-50%);font-family:var(--display,"Nunito",sans-serif);font-weight:900;font-size:clamp(18px,2.2vw,28px);color:#FCA500;text-shadow:0 2px 0 #8A5A00,0 0 12px rgba(252,165,0,.5);white-space:nowrap}
.fx-dot{position:fixed;width:9px;height:9px;border-radius:50%;margin:-4.5px 0 0 -4.5px}
.fx-banner{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);text-align:center;font-family:var(--display,"Nunito",sans-serif);font-weight:900;color:#fff;
  font-size:clamp(30px,6vw,72px);text-shadow:0 4px 0 rgba(0,0,0,.35),0 0 30px rgba(252,165,0,.55);white-space:nowrap}
.fx-banner small{display:block;font-size:.38em;color:#FCA500;letter-spacing:.08em}
.fx-count{position:fixed;inset:0;display:grid;place-items:center;background:rgba(2,11,38,.45);z-index:59}
.fx-count b{font-family:var(--display,"Nunito",sans-serif);font-weight:900;font-size:clamp(90px,18vw,220px);color:#FCA500;text-shadow:0 8px 0 #8A5A00,0 0 60px rgba(252,165,0,.55)}`;
    document.head.appendChild(s);
  }
  const layer = () => { ensureCss(); let l = document.querySelector(".fx-layer"); if (!l) { l = document.createElement("div"); l.className = "fx-layer"; l.setAttribute("aria-hidden", "true"); document.body.appendChild(l); } return l; };
  const center = el => { const r = el.getBoundingClientRect(); return [r.left + r.width / 2, r.top + r.height / 2]; };
  const anim = (el, frames, o) => (el && el.animate && !reduce() ? el.animate(frames, typeof o === "number" ? { duration: o } : o) : null);
  const pop = (el, s = 1.12) => anim(el, [{ transform: "scale(1)" }, { transform: `scale(${s})` }, { transform: "scale(1)" }], { duration: 260, easing: "ease-out" });
  const shake = el => anim(el, [0, -9, 8, -6, 4, 0].map(x => ({ transform: `translateX(${x}px)` })), { duration: 340, easing: "ease-out" });
  const bounce = el => anim(el, [0, -18, 0, -7, 0].map(y => ({ transform: `translateY(${y}px)` })), { duration: 700, easing: "ease-out" });
  // "+1", "Overtake!" \u2026 rising from an element
  function floatText(el, text, color) {
    if (!el || reduce()) return;
    const [x, y] = center(el), s = document.createElement("div"); s.className = "fx-float"; s.textContent = text; s.style.left = x + "px"; s.style.top = y + "px"; if (color) s.style.color = color;
    layer().appendChild(s);
    s.animate([{ opacity: 0, transform: "translate(-50%,-30%) scale(.6)" }, { opacity: 1, transform: "translate(-50%,-90%) scale(1.1)", offset: 0.25 }, { opacity: 0, transform: "translate(-50%,-220%) scale(1)" }], { duration: 1100, easing: "ease-out" }).onfinish = () => s.remove();
  }
  // a burst of dots from an element (a right answer, a finish line)
  function burst(el, colors = ["#FCA500", "#3DC48A", "#fff", "#108CB5", "#ED4667"], n = 16) {
    if (!el || reduce()) return;
    const [x, y] = center(el), l = layer();
    for (let i = 0; i < n; i++) {
      const d = document.createElement("div"); d.className = "fx-dot"; d.style.left = x + "px"; d.style.top = y + "px"; d.style.background = colors[i % colors.length]; l.appendChild(d);
      const a = (Math.PI * 2 * i) / n + Math.random() * 0.4, r = 50 + Math.random() * 60;
      d.animate([{ transform: "translate(0,0) scale(1)", opacity: 1 }, { transform: `translate(${Math.cos(a) * r}px,${Math.sin(a) * r + 20}px) scale(.3)`, opacity: 0 }], { duration: 650 + Math.random() * 250, easing: "cubic-bezier(.2,.7,.3,1)" }).onfinish = () => d.remove();
    }
  }
  // an animation's end, or its planned length if the browser never finishes it (hidden page, headless, old device),
  // so a game waiting on it can never freeze
  const settle = (a, ms) => Promise.race([a ? a.finished.catch(() => {}) : Promise.resolve(), new Promise(r => setTimeout(r, ms + 150))]);
  // a big message in the middle of the screen ("3 in a row!", "Final stretch!")
  function banner(text, sub, ms = 1100) {
    if (reduce()) return Promise.resolve();
    const b = document.createElement("div"); b.className = "fx-banner"; b.innerHTML = (sub ? `<small>${sub}</small>` : "") + text; layer().appendChild(b);
    const a = b.animate([{ opacity: 0, transform: "translate(-50%,-50%) scale(.4) rotate(-6deg)" }, { opacity: 1, transform: "translate(-50%,-50%) scale(1.08) rotate(2deg)", offset: 0.18 },
      { opacity: 1, transform: "translate(-50%,-50%) scale(1) rotate(0)", offset: 0.75 }, { opacity: 0, transform: "translate(-50%,-70%) scale(.9)" }], { duration: ms, easing: "ease-out" });
    return settle(a, ms).then(() => b.remove());
  }
  // 3 \u00b7 2 \u00b7 1 \u00b7 GO! (sounds always; the big numbers only with motion on)
  async function countdown(goText = "GO!", n = 3) {
    ensureCss();
    const o = document.createElement("div"); o.className = "fx-count"; o.innerHTML = "<b></b>"; document.body.appendChild(o);
    const b = o.firstChild;
    for (let i = n; i >= 0; i--) {
      b.textContent = i ? String(i) : goText; play(i ? "beep" : "go");
      const a = anim(b, [{ transform: "scale(.3)", opacity: 0 }, { transform: "scale(1.15)", opacity: 1, offset: 0.3 }, { transform: "scale(1)", opacity: 1, offset: 0.8 }, { transform: "scale(1.4)", opacity: 0 }], { duration: 640, easing: "ease-out" });
      await (a ? settle(a, 640) : new Promise(r => setTimeout(r, 450)));
    }
    o.remove();
  }
  // items one after another (podium rows, result cards)
  const stagger = (els, step = 90) => [...els].forEach((el, i) => anim(el, [{ opacity: 0, transform: "translateY(14px)" }, { opacity: 1, transform: "none" }], { duration: 380, delay: i * step, easing: "ease-out", fill: "backwards" }));

  return { play, render, get log() { return log; }, reduce, anim, pop, shake, bounce, floatText, burst, banner, countdown, stagger, sounds: Object.keys(SOUNDS) };
})();


/* ================= Team Race ================= */
const COLORS = ["#ED4667", "#108CB5", "#FCA500", "#2F9E6E"], ROBOT = "#8C9AC0";
const wheel = x => `<g class="wheel"><circle cx="${x}" cy="27" r="6" fill="#020B26" stroke="#C9D3EA" stroke-width="2"/><path d="M${x} 22.5v9M${x - 4.5} 27h9" stroke="#C9D3EA" stroke-width="1.4"/></g>`;
const car = c => `<span class="trail"></span><span class="flame"></span><svg viewBox="0 0 74 34"><rect x="2" y="12" width="68" height="14" rx="6" fill="${c}"/><path d="M16 12l9-10h20l11 10z" fill="${c}"/><rect x="27" y="4" width="15" height="8" rx="2" fill="#BFE9F7"/><rect x="62" y="15" width="7" height="4" rx="2" fill="#FFE7A3"/>${wheel(18)}${wheel(54)}</svg>`;
const st = KIT.load("race_setup", {});
// a student always races alone against the robot; a teacher starts in class mode
const STUDENT = EDU.role() === "student";
let mode = STUDENT ? "home" : st.mode === "home" ? "home" : "class";
let names = st.names || ["Red team", "Blue team", "Gold team", "Green team"];
let RACE = null;   // the race in progress

function renderSetup() {
  $("mClass").setAttribute("aria-pressed", String(mode === "class")); $("mHome").setAttribute("aria-pressed", String(mode === "home"));
  $("teamBox").hidden = mode === "home"; $("robotBox").hidden = mode !== "home";
  const n = +$("nTeams").value;
  $("teamNames").innerHTML = Array.from({ length: n }, (_, i) => `<div class="tn"><i style="background:${COLORS[i]}"></i><input type="text" id="tn${i}" maxlength="16" value="${KIT.esc(names[i])}" aria-label="Team ${i + 1} name"></div>`).join("");
  for (let i = 0; i < n; i++) $("tn" + i).addEventListener("input", e => { names[i] = e.target.value.trim() || `Team ${i + 1}`; persist(); });
  $("pName").value = STUDENT ? EDU.user.name : st.player || "Me";
  $("whereBox").hidden = STUDENT;
  $("lessonSum").textContent = KIT.summary();
}
const persist = () => KIT.save("race_setup", { mode, names, nTeams: $("nTeams").value, len: $("len").value, robot: $("robot").value, player: $("pName").value });
if (st.nTeams) $("nTeams").value = st.nTeams; if (st.len) $("len").value = st.len; if (st.robot) $("robot").value = st.robot;
$("mClass").addEventListener("click", () => { mode = "class"; persist(); renderSetup(); });
$("mHome").addEventListener("click", () => { mode = "home"; persist(); renderSetup(); });
["nTeams", "len", "robot", "pName"].forEach(id => $(id).addEventListener("change", () => { persist(); renderSetup(); }));
$("btnLessons").addEventListener("click", () => KIT.toggle(true, true));
KIT.mountMenu({ game: "race", onChange: () => $("lessonSum").textContent = KIT.summary(), extra: [["New race", () => show("scrSetup")]] });

function show(id) { ["scrSetup", "scrRace", "scrEnd"].forEach(s => ($(s).hidden = s !== id)); }

$("btnStart").addEventListener("click", startRace);
$("btnAgain").addEventListener("click", startRace);
$("btnSetup").addEventListener("click", () => { renderSetup(); show("scrSetup"); });
async function startRace() {
  persist();
  const len = +$("len").value;
  const racers = mode === "home"
    ? [{ name: $("pName").value.trim() || "Me", color: COLORS[0], pos: 0 }, { name: "Robot", color: ROBOT, pos: 0, robot: true }]
    : Array.from({ length: +$("nTeams").value }, (_, i) => ({ name: names[i], color: COLORS[i], pos: 0 }));
  RACE = { len, racers, n: 0, odds: +$("robot").value, streak: 0, stretch: false, leader: -1 };
  KIT.started();
  $("track").innerHTML = racers.map((r, i) => `<div class="lane"><div class="name"><i style="background:${r.color}"></i><span>${KIT.esc(r.name)}</span></div><div class="road"><div class="ticks">${"<span></span>".repeat(len)}</div><div class="flag"></div><div class="car" id="car${i}" style="left:0%">${car(r.color)}</div></div></div>`).join("") + `<div class="steps">Finish line: ${len} steps</div>`;
  $("classCtl").hidden = mode === "home"; $("qBox").innerHTML = ""; $("explain").hidden = true; $("btnNext").hidden = true;
  $("btnShow").hidden = true; $("who").hidden = true; $("hint").hidden = true; $("btnMove").hidden = true;
  show("scrRace");
  FX.play("rev"); await FX.countdown();
  nextQ();
}
const tier = () => { const lead = Math.max(...RACE.racers.map(r => r.pos)) / RACE.len; return lead < .34 ? 1 : lead < .67 ? 2 : 3; };
function nextQ() {
  RACE.n++; RACE.q = KIT.nextQuestion(tier()); RACE.done = false;
  $("qNo").textContent = `Question ${RACE.n}`; $("qLesson").textContent = `${GRADES[KIT.grade].name} \u00b7 Lesson ${RACE.q.lesson}${RACE.q.skill ? " \u00b7 " + RACE.q.skill : ""}`;
  KIT.showQuestion($("qBox"), RACE.q, pickAnswer);
  $("explain").hidden = true; $("btnNext").hidden = true;
  if (mode === "class") { $("btnShow").hidden = false; $("btnMove").hidden = true; $("who").hidden = true; $("hint").hidden = false; }
}
function pickAnswer(i) {
  if (RACE.done) return;
  if (mode === "class") { document.querySelectorAll("#qBox .opt").forEach((b, j) => b.classList.toggle("pick", j === i)); FX.play("tap"); return; }
  RACE.done = true;
  const ok = i === RACE.q.correct, btn = document.querySelectorAll("#qBox .opt")[i];
  KIT.mark($("qBox"), RACE.q, i);
  if (ok) { FX.play("correct"); FX.pop(btn); FX.burst(btn); } else { FX.play("wrong"); FX.shake(btn); }
  streak(ok);
  const ex = $("explain"); ex.hidden = false; ex.classList.toggle("bad", !ok); ex.innerHTML = KIT.explain(RACE.q, i);
  const moves = [ok, Math.random() < RACE.odds];
  advance(moves);
}
$("btnShow").addEventListener("click", () => {
  RACE.done = true; KIT.mark($("qBox"), RACE.q, null); FX.play("correct"); FX.pop(document.querySelectorAll("#qBox .opt")[RACE.q.correct]);
  const ex = $("explain"); ex.hidden = false; ex.classList.remove("bad"); ex.innerHTML = KIT.explain(RACE.q, RACE.q.correct);
  $("btnShow").hidden = true; $("hint").hidden = true;
  $("who").hidden = false;
  $("who").innerHTML = `<span class="hint">Which teams got it right?</span>` + RACE.racers.map((r, i) => `<button class="t" data-i="${i}" aria-pressed="false"><i style="background:${r.color}"></i>${KIT.esc(r.name)}</button>`).join("");
  $("who").querySelectorAll(".t").forEach(b => b.addEventListener("click", () => b.setAttribute("aria-pressed", String(b.getAttribute("aria-pressed") !== "true"))));
  $("btnMove").hidden = false;
});
$("btnMove").addEventListener("click", () => {
  const moves = RACE.racers.map((_, i) => $("who").querySelector(`.t[data-i="${i}"]`).getAttribute("aria-pressed") === "true");
  $("btnMove").hidden = true; $("who").hidden = true;
  advance(moves);
});
// home mode: 3, 5, 8 \u2026 right answers in a row \u2192 a banner and a boost flame on the player's car (looks only; the race stays fair)
function streak(ok) {
  RACE.streak = ok ? RACE.streak + 1 : 0;
  $("car0").classList.toggle("boost", RACE.streak >= 3);
  if (ok && (RACE.streak === 3 || RACE.streak === 5 || (RACE.streak > 5 && RACE.streak % 3 === 2))) { FX.play("streak"); FX.banner(`${RACE.streak} in a row!`, "STREAK"); }
}
const leaderOf = () => { const top = Math.max(...RACE.racers.map(r => r.pos)), at = RACE.racers.map((r, i) => (r.pos === top ? i : -1)).filter(i => i >= 0); return top > 0 && at.length === 1 ? at[0] : -1; };
function advance(moves) {
  let any = false;
  const before = leaderOf(), aheadBefore = mode === "home" && RACE.racers[0].pos > RACE.racers[1].pos;
  RACE.racers.forEach((r, i) => {
    const c = $("car" + i);
    if (moves[i] && r.pos < RACE.len) {
      r.pos++; any = true;
      c.classList.add("moving"); c.parentNode.classList.add("moving");
      setTimeout(() => { c.classList.remove("moving"); c.parentNode.classList.remove("moving"); }, 750);
      FX.anim(c.querySelector("svg"), [{ transform: "translateY(0) rotate(0)" }, { transform: "translateY(-7px) rotate(-6deg)", offset: 0.3 }, { transform: "translateY(0) rotate(0)" }], { duration: 650, easing: "ease-out" });
      setTimeout(() => FX.floatText(c, "+1", r.color), 380);
    }
    c.style.left = `calc(${(r.pos / RACE.len) * 100}% - ${(r.pos / RACE.len) * 64}px)`;
  });
  if (any) { FX.play("whoosh"); FX.play("engine"); }
  const lead = leaderOf();
  RACE.racers.forEach((_, i) => $("car" + i).classList.toggle("lead", i === lead));
  if (mode === "home" && !aheadBefore && RACE.racers[0].pos > RACE.racers[1].pos) setTimeout(() => { FX.play("overtake"); FX.floatText($("car0"), "Overtake!", "#3DC48A"); }, 700);
  else if (mode === "class" && lead >= 0 && lead !== before && lead !== RACE.leader) setTimeout(() => { FX.play("overtake"); FX.floatText($("car" + lead), "Takes the lead!", "#3DC48A"); }, 700);
  if (lead >= 0) RACE.leader = lead;
  const winners = RACE.racers.filter(r => r.pos >= RACE.len), top = Math.max(...RACE.racers.map(r => r.pos));
  if (!winners.length && !RACE.stretch && top >= RACE.len - 2) { RACE.stretch = true; setTimeout(() => { FX.play("stretch"); FX.banner("Final stretch!", "ALMOST THERE"); }, 800); }
  if (winners.length) {
    RACE.racers.forEach((r, i) => { if (r.pos >= RACE.len) { const flag = $("car" + i).parentNode.querySelector(".flag"); flag.classList.add("wave"); setTimeout(() => FX.burst(flag), 600); } });
    setTimeout(() => finish(winners), 1500);
  } else $("btnNext").hidden = false;
}
$("btnNext").addEventListener("click", nextQ);
KIT.keys((i, e) => {
  if ($("scrRace").hidden) return;
  if (i >= 0) pickAnswer(i);
  else if (!$("btnNext").hidden) nextQ();
  else if (!$("btnShow").hidden && mode === "class") $("btnShow").click();
});
function finish(winners) {
  const names2 = winners.map(w => w.name);
  $("endKicker").textContent = names2.length > 1 ? "IT'S A TIE!" : "AND THE WINNER IS";
  $("winner").textContent = names2.join(" & ");
  $("podium").innerHTML = RACE.racers.slice().sort((a, b) => b.pos - a.pos).map(r => `<div class="${r.pos >= RACE.len ? "first" : ""}"><span>${KIT.esc(r.name)}</span><span>${r.pos} / ${RACE.len} steps</span></div>`).join("") +
    `<div><span>Questions</span><span>${RACE.n}</span></div>`;
  show("scrEnd");
  FX.pop($("winner"), 1.2); FX.bounce($("scrEnd").querySelector("img")); FX.stagger($("podium").children);
  if (!winners.every(w => w.robot)) { KIT.confetti(); FX.play("win"); } else FX.play("wrong");
}
renderSetup();
</script>
