<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Math Games</title>
<meta name="theme-color" content="#051C54">
<style>
:root{--deep:#020B26;--stage:#051C54;--silver:#C9D3EA;--gold:#FCA500}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse 70% 70% at 50% 30%,#1B3F8F,var(--stage) 60%,var(--deep));color:#fff;
  font-family:"Arial Rounded MT Bold","Segoe UI",sans-serif;display:flex;flex-direction:column;align-items:center;padding:40px 16px;box-sizing:border-box;gap:24px}
h1{color:var(--gold);margin:0;font-size:clamp(30px,6vw,56px)}
p{color:var(--silver);margin:0}
a.game{display:flex;align-items:center;gap:16px;background:rgba(2,11,38,.6);border:2px solid var(--silver);border-radius:16px;padding:14px 22px;color:#fff;text-decoration:none;width:min(460px,100%);box-sizing:border-box}
a.game:hover,a.game:focus-visible{border-color:var(--gold)}
a.game img{width:64px;height:64px;border-radius:14px}
a.game b{display:block;font-size:22px}
a.game span{color:var(--silver);font-family:"Segoe UI",sans-serif;font-size:14px}
</style>
</head>
<body>
<h1>Math Games</h1>
<p>Classroom review games</p>
<a class="game" href="grade4-millionaire/"><img src="grade4-millionaire/icon-192.png" alt=""><span><b>Math Millionaire</b>Grades 4 and 5</span></a>
</body>
</html>
