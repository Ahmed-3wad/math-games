<style>
/* Layout: an app home screen &#x2014; brand bar, grade chips, then a grid of game cards (playable first, "coming soon" after).
   Same night-sky navy and gold as the games, so moving between the hub and a game feels like one app. */
:root{
  --deep:#020B26; --stage:#051C54; --panel:#0B2563; --silver:#C9D3EA; --muted:#8C9AC0;
  --gold:#FCA500; --gold-dark:#8A5A00; --teal:#108CB5; --green:#2F9E6E; --coral:#ED4667; --ink:#051C54;
  --display:"Nunito","Arial Rounded MT Bold","Segoe UI",sans-serif;
  --body:"Segoe UI","Nunito",Tahoma,sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--deep);color:#fff;font-family:var(--body)}
html[dir="rtl"] body{--display:"Cairo","Nunito",sans-serif;--body:"Cairo","Segoe UI",sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.app{min-height:100%;position:relative;overflow-x:hidden;
  background:radial-gradient(ellipse 80% 60% at 50% 0%,#1B3F8F 0%,#0A2466 40%,var(--stage) 70%,var(--deep) 100%);
  padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
.rays{position:absolute;inset:0 0 auto 0;height:520px;pointer-events:none;
  background:repeating-conic-gradient(from 0deg at 50% -10%,rgba(255,255,255,.035) 0 5deg,transparent 5deg 12deg);
  -webkit-mask-image:linear-gradient(#000,transparent);mask-image:linear-gradient(#000,transparent)}
.wrap{position:relative;max-width:1180px;margin:0 auto;padding-block:16px 40px;padding-inline:16px;display:flex;flex-direction:column;gap:22px}

/* brand bar */
.bar{display:flex;align-items:center;gap:12px}
.logo{display:flex;align-items:center;gap:12px;text-decoration:none}
.logo img{width:46px;height:46px;border-radius:12px;box-shadow:0 4px 14px rgba(0,0,0,.4)}
.logo b{font-family:"Nunito",sans-serif;font-weight:900;font-size:26px;color:var(--gold);letter-spacing:.01em}
.logo span{font-family:"Cairo",sans-serif;font-weight:800;font-size:20px;color:#fff}
.spacer{flex:1}
.lang{display:flex;border:1.5px solid rgba(201,211,234,.5);border-radius:99px;overflow:hidden}
.lang button{background:transparent;border:0;padding:6px 14px;font-size:14px;font-family:var(--display)}
.lang button[aria-pressed="true"]{background:var(--gold);color:var(--ink)}

/* hero */
.hero{display:flex;flex-direction:column;gap:6px;padding-block:6px}
.hero h1{margin:0;font-family:var(--display);font-weight:900;font-size:clamp(28px,4.6vw,52px);line-height:1.1;text-wrap:balance}
.hero h1 em{font-style:normal;color:var(--gold)}
.hero p{margin:0;color:var(--silver);font-size:clamp(15px,1.6vw,19px);max-width:60ch}

/* grade chips */
.grades{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grades .lbl{font-family:var(--display);color:var(--muted);font-size:14px;margin-inline-end:4px}
.chip{border:1.5px solid rgba(201,211,234,.45);background:rgba(2,11,38,.45);border-radius:99px;padding:7px 16px;font-family:var(--display);font-size:15px;font-variant-numeric:tabular-nums}
.chip:hover{border-color:var(--gold)}
.chip[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:var(--ink)}

/* game cards */
.section-title{display:flex;align-items:baseline;gap:10px;margin:6px 0 -6px}
.section-title h2{margin:0;font-family:var(--display);font-size:20px}
.section-title span{color:var(--muted);font-size:14px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.card{position:relative;display:flex;flex-direction:column;gap:10px;min-width:0;text-decoration:none;
  background:linear-gradient(180deg,rgba(27,63,143,.55),rgba(5,28,84,.75));border:1.5px solid rgba(201,211,234,.28);border-radius:20px;padding:16px;transition:transform .15s,border-color .15s}
a.card:hover{transform:translateY(-3px);border-color:var(--gold)}
.card.soon{background:rgba(2,11,38,.45);border-style:dashed}
.art{height:120px;border-radius:14px;display:grid;place-items:center;overflow:hidden;background:radial-gradient(ellipse at 50% 30%,#1B3F8F,var(--stage) 70%)}
.card.soon .art{filter:saturate(.55);opacity:.8}
.art svg{width:100%;height:100%;direction:ltr}
.card h3{margin:0;font-family:var(--display);font-size:19px;line-height:1.25}
.card p{margin:0;color:var(--silver);font-size:14px;line-height:1.5}
.meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto}
.tag{font-size:12px;font-family:var(--display);border-radius:99px;padding:3px 10px;background:rgba(16,140,181,.25);color:#BFE9F7}
.tag.play{background:var(--gold);color:var(--ink)}
.tag.soonT{background:rgba(201,211,234,.15);color:var(--silver)}
.empty{color:var(--muted);font-size:15px;padding:8px 0}

.foot{display:flex;flex-wrap:wrap;gap:8px 18px;justify-content:space-between;color:var(--muted);font-size:13px;border-top:1px solid rgba(201,211,234,.15);padding-top:14px}
.foot button{background:none;border:0;color:var(--gold);text-decoration:underline;padding:0;font-size:13px}

.overlay{position:fixed;inset:0;background:rgba(2,11,38,.82);display:grid;place-items:center;padding:16px;z-index:20}
.modal{background:var(--stage);border:2px solid var(--silver);border-radius:18px;padding:20px 22px;width:min(560px,100%);box-sizing:border-box}
.modal h3{margin:0 0 10px;font-family:var(--display);color:var(--gold)}
.modal ol{margin:0 0 6px;padding-inline-start:1.3em;line-height:1.7}
.modal .btn{margin-top:10px;background:var(--gold);color:var(--ink);border:0;border-radius:99px;padding:8px 22px;font-family:var(--display)}
/* account */
.acct{border:1.5px solid rgba(201,211,234,.5);background:rgba(2,11,38,.5);border-radius:99px;padding:6px 14px;font-family:var(--display);font-size:14px;display:flex;align-items:center;gap:8px}
.acct i{width:26px;height:26px;border-radius:50%;background:var(--gold);color:var(--ink);display:grid;place-items:center;font-style:normal;font-weight:900}
.mine{display:grid;grid-template-columns:auto 1fr auto;gap:16px;align-items:center;background:rgba(2,11,38,.55);border:1.5px solid rgba(252,165,0,.45);border-radius:20px;padding:14px 18px}
.mine img{height:84px}
.mine h2{margin:0 0 4px;font-family:var(--display);font-size:20px}
.mine .facts{display:flex;gap:18px;flex-wrap:wrap;color:var(--silver);font-size:14px}
.mine .facts b{color:var(--gold);font-family:var(--display);font-size:20px;margin-inline-end:4px}
.mine a.btnc{background:var(--gold);color:var(--ink);text-decoration:none;font-family:var(--display);border-radius:99px;padding:10px 20px;white-space:nowrap}
@media (max-width:640px){.mine{grid-template-columns:1fr}.mine img{display:none}}
.welcome{width:min(620px,100%);text-align:start}
.welcome h3{font-size:clamp(22px,3vw,30px)}
.who{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0}
.who button{border:2px solid rgba(201,211,234,.45);background:rgba(2,11,38,.5);border-radius:16px;padding:16px 14px;text-align:start;display:flex;flex-direction:column;gap:4px}
.who button:hover{border-color:var(--gold)}
.who button b{font-family:var(--display);font-size:19px;color:var(--gold)}
.who button span{font-size:13px;color:var(--silver);line-height:1.45}
@media (max-width:520px){.who{grid-template-columns:1fr}}
.links{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:14px}
.links button,.lnk{background:none;border:0;color:var(--gold);text-decoration:underline;padding:0;font-size:14px}
.form{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--silver)}
.form input,.form select{background:var(--deep);border:1.5px solid rgba(201,211,234,.5);border-radius:10px;color:#fff;padding:10px 12px;font:inherit;font-size:16px}
.form .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form .chk{flex-direction:row;align-items:flex-start;gap:8px;color:#fff}
.form .chk input{width:18px;height:18px;accent-color:var(--gold);margin-top:2px}
.err{color:#FF8FA6;font-size:14px;min-height:1.2em}
.note2{color:var(--muted);font-size:12.5px}
.ucard{background:var(--deep);border:2px dashed var(--gold);border-radius:16px;padding:16px;text-align:center;margin:12px 0}
.ucard.rcard{border-style:solid;display:flex;flex-direction:column;gap:6px}
.ucard.rcard b{font-family:Consolas,"Nunito",monospace;letter-spacing:.12em}
.clist{list-style:none;margin:6px 0 14px;padding:0;display:flex;flex-direction:column;gap:6px}
.clist li{display:flex;justify-content:space-between;gap:10px;background:var(--deep);border-radius:10px;padding:8px 12px}
.joined{color:#7FE3B6;font-weight:700}
.btn.ghost{background:transparent;color:var(--gold);border:2px solid var(--gold)}
.ucard b{display:block;font-family:"Nunito",monospace;font-size:34px;color:var(--gold);letter-spacing:.04em;direction:ltr}
.plist{margin:0;padding-inline-start:1.2em;line-height:1.8}
.arow{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.arow button,.arow a{background:rgba(2,11,38,.5);border:1.5px solid rgba(201,211,234,.4);border-radius:12px;padding:10px 14px;font-family:var(--display);color:#fff;text-decoration:none;text-align:start}
.arow button:hover,.arow a:hover{border-color:var(--gold)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="app">
  <div class="rays"></div>
  <div class="wrap">
    <header class="bar">
      <a class="logo" href="./" aria-label="Math Games"><img src="icon-192.png" alt=""><b>Math Games</b><span>&#x623;&#x644;&#x639;&#x627;&#x628; &#x627;&#x644;&#x631;&#x64a;&#x627;&#x636;&#x64a;&#x627;&#x62a;</span></a>

<script>
window.EDU_BACKEND = { "url": "https://gihclosptgwzghthuxtv.supabase.co", "anonKey": "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdpaGNsb3NwdGd3emdodGh1eHR2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA4NTkwNDcsImV4cCI6MjEwNjQzNTA0N30.uMXopcrg4n5Pa5MRg9QvMFqFI5MdxBIqSk8b0u7Mit4" };
/* ================= accounts, progress sync and usage stats (shared by the app home, every game and admin) ================= */
// Two backends with the same calls:
//   server \u2014 Supabase (window.EDU_BACKEND = { url, anonKey } from app/backend.json): works on any device, feeds the admin dashboard
//   device \u2014 localStorage only, used until the server is configured (same screens; data stays on this device)
const EDU = (() => {
  const cfg = window.EDU_BACKEND || {};
  const SERVER = !!(cfg.url && cfg.anonKey);
  const rawSet = Storage.prototype.setItem, rawRemove = Storage.prototype.removeItem;
  const get = (k, d) => { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } };
  const put = (k, v) => { try { rawSet.call(localStorage, k, JSON.stringify(v)); } catch {} };
  const drop = k => { try { rawRemove.call(localStorage, k); } catch {} };
  // what belongs to a player and travels with the account
  const MINE = /^(edu_by_|edu_lessons_|edu_skills_|edu_grade$|edu_last$|map_progress_|minute_best_|minute_secs$|race_setup$|mm4_)/;
  const myKeys = () => { const out = []; try { for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (MINE.test(k)) out.push(k); } } catch {} return out; };

  let user = get("edu_user", null);          // { token, username, name, grade, role, device? }
  let dirty = {}, saveTimer = null;           // progress keys waiting to be saved for the signed-in player

  /* ---- server calls (Supabase RPC) ---- */
  async function rpc(fn, args) {
    const r = await fetch(`${cfg.url}/rest/v1/rpc/${fn}`, {
      method: "POST", keepalive: fn === "log_events" || fn === "save_progress",
      headers: { apikey: cfg.anonKey, Authorization: `Bearer ${cfg.anonKey}`, "Content-Type": "application/json" },
      body: JSON.stringify(args),
    });
    const text = await r.text(), data = text ? JSON.parse(text) : null;
    if (!r.ok) throw new Error((data && (data.message || data.hint)) || "Could not reach the server. Check the internet.");
    if (data && data.error) throw new Error(data.error);
    return data;
  }

  /* ---- device backend ---- */
  const devProfiles = () => get("edu_device_profiles", {});
  async function hash(s) {
    try { const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode("edugames|" + s)); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, "0")).join(""); }
    catch { let h = 0; for (const c of "edugames|" + s) h = (h * 31 + c.charCodeAt(0)) | 0; return "w" + h; }
  }
  const WORDS = ["falcon", "lion", "comet", "rocket", "panda", "eagle", "tiger", "star", "dolphin", "camel"];
  function newUsername(name, taken) {
    let base = name.toLowerCase().replace(/[^a-z]/g, "").slice(0, 10);
    if (base.length < 2) base = WORDS[Math.floor(Math.random() * WORDS.length)];
    let u; do { u = base + (100 + Math.floor(Math.random() * 900)); } while (taken[u]);
    return u;
  }

  /* ---- shared checks (same rules as the server) ---- */
  function checkStudent(name, grade, pin, consent) {
    if (!consent) throw new Error("A parent must agree before creating an account.");
    if (!/^\d{4}$/.test(pin || "")) throw new Error("The PIN must be 4 digits.");
    name = (name || "").trim();
    if (name.length < 2 || name.length > 20) throw new Error("Write a first name of 2 to 20 letters.");
    if (!["KG", "1", "2", "3", "4", "5", "6"].includes(grade)) throw new Error("Choose a grade.");
    return name;
  }
  function checkTeacher(name, email, password, consent) {
    if (!consent) throw new Error("Please accept the terms.");
    name = (name || "").trim(); email = (email || "").trim().toLowerCase();
    if (name.length < 2 || name.length > 40) throw new Error("Write your name.");
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) throw new Error("Write a valid email address.");
    if ((password || "").length < 8) throw new Error("The password must be at least 8 characters.");
    return [name, email];
  }

  /* ---- sign up / sign in / out ---- */
  // a person is signed in on this device. A NEW account keeps what was played here as a guest;
  // signing in to an existing account replaces it with that account's saved progress.
  async function start(u, isNew) {
    if (user) await flush(true);                  // save the previous person's last changes first
    if (!isNew || user) clearMine();
    user = u; put("edu_user", u);
    if (isNew) { myKeys().forEach(k => { try { dirty[k] = localStorage.getItem(k); } catch {} }); }
    if (u.grade) put("edu_grade", u.grade);
    if (isNew) { if (u.grade) dirty.edu_grade = JSON.stringify(u.grade); await flush(); } else await pull();
    return u;
  }
  // the recovery code is shown once (EDU.recovery) and never kept on the device
  let recovery = null;
  const keepRecovery = r => { const { recovery: code, ...u } = r; recovery = code || null; return u; };
  const RC = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  const newCode = () => { const b = crypto.getRandomValues(new Uint8Array(8)); const c = [...b].map(x => RC[x % 32]).join(""); return c.slice(0, 4) + "-" + c.slice(4); };
  const cleanCode = c => (c || "").toUpperCase().replace(/[^A-Z0-9]/g, "");
  function checkParent(e) {
    e = (e || "").trim().toLowerCase();
    if (e && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(e)) throw new Error("Write a valid parent email, or leave it empty.");
    return e;
  }
  async function signupStudent({ name, grade, pin, consent, parentEmail }) {
    name = checkStudent(name, grade, pin, consent); parentEmail = checkParent(parentEmail);
    if (SERVER) return start(keepRecovery(await rpc("signup_student", { p_name: name, p_grade: grade, p_pin: pin, p_consent: true, p_parent_email: parentEmail || null })), true);
    const all = devProfiles(), username = newUsername(name, all), code = newCode();
    all[username] = { role: "student", name, grade, hash: await hash(username + pin), rhash: await hash(username + cleanCode(code)), parent_email: parentEmail || null, progress: {}, created: Date.now() };
    put("edu_device_profiles", all); recovery = code;
    return start({ token: "device", username, name, grade, role: "student", parent_email: parentEmail || null, device: true }, true);
  }
  async function signupTeacher({ name, email, password, consent }) {
    [name, email] = checkTeacher(name, email, password, consent);
    if (SERVER) return start(await rpc("signup_teacher", { p_name: name, p_email: email, p_password: password, p_consent: true }), true);
    const all = devProfiles();
    if (all[email]) throw new Error("This email already has an account. Sign in instead.");
    all[email] = { role: "teacher", name, grade: null, hash: await hash(email + password), progress: {}, created: Date.now() };
    put("edu_device_profiles", all);
    return start({ token: "device", username: email, name, grade: null, role: "teacher", device: true }, true);
  }
  async function login(username, secret) {
    username = (username || "").trim().toLowerCase();
    if (SERVER) return start(await rpc("login", { p_username: username, p_secret: secret }));
    const p = devProfiles()[username];
    if (!p || p.hash !== await hash(username + secret)) throw new Error("Wrong username or PIN/password.");
    return start({ token: "device", username, name: p.name, grade: p.grade, role: p.role, device: true });
  }
  async function logout() {
    await flush(true);
    if (SERVER && user && user.token) rpc("logout", { p_token: user.token }).catch(() => {});
    clearMine(); user = null; drop("edu_user");
  }
  async function refresh() {                      // check the saved session is still valid (server only)
    if (!SERVER || !user || user.device) return user;
    try { const u = await rpc("me", { p_token: user.token }); user = { ...user, ...u }; put("edu_user", user); }
    catch (e) { if (/sign in again/i.test(e.message)) { clearMine(); user = null; drop("edu_user"); } }
    return user;
  }
  function clearMine() { myKeys().forEach(drop); }
  // edit my own profile: name, grade (students), and a new PIN/password (needs the current one)
  async function updateProfile({ name, grade, oldSecret, newSecret, parentEmail }) {
    if (!user) throw new Error("Please sign in again.");
    const student = user.role === "student";
    name = (name || "").trim();
    if (name.length < 2 || name.length > (student ? 20 : 40)) throw new Error(student ? "Write a first name of 2 to 20 letters." : "Write your name.");
    if (student && !["KG", "1", "2", "3", "4", "5", "6"].includes(grade)) throw new Error("Choose a grade.");
    if (newSecret && student && !/^\d{4}$/.test(newSecret)) throw new Error("The PIN must be 4 digits.");
    if (newSecret && !student && newSecret.length < 8) throw new Error("The password must be at least 8 characters.");
    if (student && parentEmail !== undefined) parentEmail = checkParent(parentEmail);
    let u;
    if (SERVER && !user.device) u = await rpc("update_profile", { p_token: user.token, p_name: name, p_grade: student ? grade : null, p_old_secret: oldSecret || "", p_new_secret: newSecret || "", p_parent_email: student && parentEmail !== undefined ? parentEmail : null });
    else {
      const all = devProfiles(), p = all[user.username]; if (!p) throw new Error("Please sign in again.");
      const pe = student && parentEmail !== undefined ? parentEmail || null : p.parent_email || null;
      if (newSecret || pe !== (p.parent_email || null)) { if (p.hash !== await hash(user.username + (oldSecret || ""))) throw new Error(student ? "The current PIN is wrong." : "The current password is wrong."); }
      if (newSecret) p.hash = await hash(user.username + newSecret);
      p.name = name; if (student) { p.grade = grade; p.parent_email = pe; } put("edu_device_profiles", all);
      u = { name, grade: student ? grade : user.grade, parent_email: student ? pe : null };
    }
    user = { ...user, name: u.name, grade: u.grade, parent_email: u.parent_email || null }; put("edu_user", user);

  on("wRec", () => welcome("recover")); on("wMail", () => welcome("mail"));
  on("fSend", async () => {
    const err = $("fErr"), btn = $("fSend"), who = $("fWho").value.trim(); err.textContent = ""; btn.disabled = true; btn.textContent = t.wait;
    try { await EDU.requestReset(who); $("fStep2").hidden = false; if (!$("fUser").value) $("fUser").value = who.toLowerCase(); $("fCode").focus(); }
    catch (e) { err.textContent = e.message; }
    btn.disabled = false; btn.textContent = t.sendCode;
  });
  on("fGo", async () => {
    const err = $("fErr2") || $("fErr"), btn = $("fGo"); err.textContent = ""; btn.disabled = true; btn.textContent = t.wait;
    try {
      if (view === "recover" || view === "mail") {
        if ($("fNew").value !== $("fNew2").value) throw new Error(t.same);
        if (view === "recover") { await EDU.resetWithRecovery($("fUser").value, $("fCode").value, $("fNew").value); welcome("newrec"); render(); return; }
        await EDU.resetWithCode($("fUser").value, $("fCode").value, $("fNew").value);
        $("ovWelcome").hidden = true; grade = "all"; render(); return;
      }
      if (view === "student") {
        if ($("fPin").value !== $("fPin2").value) throw new Error(t.pinDiff);
        // a class code is checked before the account is made, then joined right after
        const code = $("fClass").value.trim(); welcome.joined = code ? await EDU.classes.info(code) : null;
        await EDU.signupStudent({ name: $("fName").value, grade: $("fGrade").value, pin: $("fPin").value, consent: $("fOk").checked, parentEmail: $("fParent").value });
        if (code) await EDU.classes.join(code).catch(() => (welcome.joined = null));
        welcome("done"); return;
      }
      if (view === "teacher") await EDU.signupTeacher({ name: $("fName").value, email: $("fEmail").value, password: $("fPass").value, consent: $("fOk").checked });
      if (view === "signin") await EDU.login($("fUser").value, $("fSecret").value);
      $("ovWelcome").hidden = true; grade = "all"; render();
    } catch (e) { err.textContent = e.message; btn.disabled = false; btn.textContent = view === "teacher" ? t.createT : view === "signin" ? t.signin : view === "recover" || view === "mail" ? t.setNew : t.create; }
  });
  const first = w.querySelector("input,button"); first && first.focus();
}
// username + recovery code, the way the student should keep them
function recCard(code) {
  const t = T[lang], u = EDU.user;
  return `<div class="ucard">${t.yourUser}<b>${escH(u.username)}</b></div>` + (code ? `<div class="ucard rcard">${t.recCode}<b>${escH(code)}</b><span class="note2">${t.recS}</span></div>
    <button class="btn ghost" id="fSave" type="button">${t.saveCard}</button>` : "");
}
function saveCard() {
  const t = T[lang], u = EDU.user, code = EDU.recovery; if (!u || !code) return;
  const c = document.createElement("canvas"); c.width = 900; c.height = 520; const g = c.getContext("2d");
  const grd = g.createLinearGradient(0, 0, 0, 520); grd.addColorStop(0, "#0B2563"); grd.addColorStop(1, "#020B26");
  g.fillStyle = grd; g.fillRect(0, 0, 900, 520);
  g.strokeStyle = "#FCA500"; g.lineWidth = 6; g.setLineDash([18, 12]); g.strokeRect(24, 24, 852, 472); g.setLineDash([]);
  g.textAlign = "center"; g.fillStyle = "#FCA500"; g.font = "900 40px Nunito, Segoe UI, sans-serif"; g.fillText(`${BRAND.en} \u00b7 ${t.cardFor}`, 450, 96);
  g.fillStyle = "#C9D3EA"; g.font = "600 26px Segoe UI, sans-serif"; g.fillText(`${u.name} \u00b7 ${t.yourUser}`, 450, 170);
  g.fillStyle = "#fff"; g.font = "900 56px Nunito, Segoe UI, sans-serif"; g.fillText(u.username, 450, 236);
  g.fillStyle = "#C9D3EA"; g.font = "600 26px Segoe UI, sans-serif"; g.fillText(t.recCode, 450, 310);
  g.fillStyle = "#FCA500"; g.font = "900 76px Consolas, monospace"; g.fillText(code, 450, 390);
  g.fillStyle = "#8C9AC0"; g.font = "500 20px Segoe UI, sans-serif"; g.fillText(new Date().toLocaleDateString("en-GB") + " \u00b7 keep it secret", 450, 456);
  const a = document.createElement("a"); a.download = `recovery-${u.username}.png`; a.href = c.toDataURL("image/png"); document.body.appendChild(a); a.click(); a.remove();
}
function renderAccount() {
  const t = T[lang], u = EDU.user, btn = $("acctBtn");
  btn.hidden = false;
  btn.innerHTML = u ? `<i>${escH(u.name[0].toUpperCase())}</i>${escH(u.name)}` : t.signin;
  // student progress card
  const box = $("mine");
  if (!u || u.role !== "student") { box.hidden = true; return; }
  const g = load("edu_grade", u.grade), maps = load("map_progress_" + g, {}), stars = Object.values(maps).reduce((a, b) => a + b, 0);
  let best = 0; try { for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k.startsWith("minute_best_" + g + "_")) best = Math.max(best, +localStorage.getItem(k) || 0); } } catch {}
  const last = load("edu_last", null), lastG = last && GAMES.find(x => x.id === last.game && x.ready);
  box.hidden = false;
  box.innerHTML = `<img src="crew/omar_celebrate.png" alt=""><div><h2>${t.hi(escH(u.name))}</h2><div class="facts">${stars || best || lastG ? `<span><b>${stars}</b>${t.stars}</span><span><b>${best}</b>${t.best}</span>${lastG ? `<span>${t.last}: <b style="font-size:16px">${lastG[lang][0]}</b></span>` : ""}` : `<span>${t.noProg}</span>`}</div></div>${lastG ? `<a class="btnc" href="${lastG.href}">${t.cont}</a>` : ""}`;
}
function acctMenu() {
  const t = T[lang], u = EDU.user;
  if (!u) { welcome("choose"); return; }
  const roleName = u.role === "student" ? t.roleS : u.role === "admin" ? t.roleA : t.roleT;
  const canAdmin = u.role === "admin" || (!EDU.server && u.role === "teacher");
  $("acctBox").innerHTML = `<h3>${t.signedAs}</h3><p><b>${escH(u.name)}</b> \u00b7 ${roleName}${u.grade ? ` \u00b7 ${lang === "ar" ? "\u0627\u0644\u0635\u0641" : "Grade"} ${u.grade}` : ""}<br><span class="note2" dir="ltr">${escH(u.username)}</span></p>
    <div class="arow">${canAdmin ? `<a href="admin/">${t.admin}</a>` : ""}${u.role !== "student" && EDU.server ? `<a href="teacher/">${t.teacherPage}</a>` : ""}${u.role === "student" && EDU.server ? `<button id="aClasses">${t.myClasses}</button>` : ""}<button id="aEdit">${t.edit}</button><button id="aSwitch">${t.sw}</button><button id="aOut">${t.out}</button><button id="aClose">${t.close}</button></div>`;
  $("ovAcct").hidden = false;
  $("aClose").addEventListener("click", () => ($("ovAcct").hidden = true));
  $("aEdit").addEventListener("click", editProfile);
  $("aClasses") && $("aClasses").addEventListener("click", myClasses);
  $("aOut").addEventListener("click", async () => { await EDU.logout(); try { localStorage.removeItem("edu_guest"); } catch {} $("ovAcct").hidden = true; render(); welcome("choose"); });
  $("aSwitch").addEventListener("click", async () => { await EDU.logout(); $("ovAcct").hidden = true; render(); welcome("signin"); });
}
// edit my profile: name, grade (students), PIN/password with the current one
function editProfile() {
  const t = T[lang], u = EDU.user, kid = u.role === "student";
  const gradeSel = GRADE_OPTS.map(([g, n]) => `<option value="${g}"${g === u.grade ? " selected" : ""}>${lang === "ar" && g === "KG" ? "\u0627\u0644\u0631\u0648\u0636\u0629" : n}</option>`).join("");
  const sec = kid ? `inputmode="numeric" pattern="[0-9]*" maxlength="4"` : `dir="ltr"`;
  $("acctBox").innerHTML = `<h3>${t.editT}</h3><div class="form">
    <label>${kid ? t.firstName : t.tName}<input id="eName" maxlength="${kid ? 20 : 40}" value="${escH(u.name)}"></label>
    ${kid ? `<label>${t.gradeL}<select id="eGrade">${gradeSel}</select></label>` : ""}
    <p class="note2">${kid ? t.userN : t.emailL}: <b dir="ltr">${escH(u.username)}</b></p>
    ${kid ? `<label>${t.parentL}<input id="eParent" type="email" dir="ltr" value="${escH(u.parent_email || "")}"><span class="note2">${t.parentHelp}</span></label>` : ""}
    <b style="font-size:14px">${kid ? t.chPin : t.chPass}</b>${kid ? `<span class="note2">${t.needCurFor}</span>` : ""}
    <div class="two"><label>${kid ? t.curPin : t.curPass}<input id="eOld" type="password" autocomplete="current-password" ${sec}></label><label>${kid ? t.newPin : t.newPass}<input id="eNew" type="password" autocomplete="new-password" ${sec}></label></div>
    <div class="err" id="eErr"></div><button class="btn" id="eGo">${t.saveP}</button><div class="links">${kid ? `<button id="eRec">${t.newRec}</button>` : ""}<button id="eBack">${t.back}</button></div></div>`;
  $("eBack").addEventListener("click", acctMenu);
  $("eGo").addEventListener("click", async () => {
    const err = $("eErr"), btn = $("eGo"), oldS = $("eOld").value, newS = $("eNew").value; err.textContent = "";
    const parent = kid ? $("eParent").value.trim().toLowerCase() : undefined;
    if ((newS || (kid && parent !== (u.parent_email || ""))) && !oldS) { err.textContent = kid ? t.needCurFor : t.needCur; $("eOld").focus(); return; }
    btn.disabled = true; btn.textContent = t.wait;
    try {
      await EDU.updateProfile({ name: $("eName").value, grade: kid ? $("eGrade").value : null, oldSecret: oldS, newSecret: newS, parentEmail: parent });
      if (kid) { grade = EDU.user.grade; save("edu_hubGrade", grade); }
      render(); btn.textContent = t.saved; setTimeout(acctMenu, 900);
    } catch (e) { err.textContent = e.message; btn.disabled = false; btn.textContent = t.saveP; }
  });
  if (kid) $("eRec").addEventListener("click", async () => {
    const err = $("eErr"); err.textContent = "";
    if (!$("eOld").value) { err.textContent = t.needCurFor; $("eOld").focus(); return; }
    try {
      await EDU.newRecoveryCode($("eOld").value);
      $("acctBox").innerHTML = `<h3>${t.newRecT}</h3><p>${t.newRecS} ${t.recS}</p>${recCard(EDU.recovery)}<div class="links"><button id="eBack2">${t.back}</button></div>`;
      $("fSave").addEventListener("click", saveCard); $("eBack2").addEventListener("click", acctMenu);
    } catch (e) { err.textContent = e.message; }
  });
  $("eName").focus();
}
// a student's classes: the list, leave, and join with a code (the class is shown before joining)
async function myClasses() {
  const t = T[lang], box = $("acctBox");
  box.innerHTML = `<h3>${t.myClasses}</h3><p class="note2">${t.wait}</p>`;
  let list = [];
  try { list = await EDU.classes.mine(); } catch (e) { box.innerHTML = `<h3>${t.myClasses}</h3><div class="err">${escH(e.message)}</div><div class="links"><button id="cBack">${t.back}</button></div>`; $("cBack").addEventListener("click", acctMenu); return; }
  box.innerHTML = `<h3>${t.myClasses}</h3>${list.length ? `<ul class="clist">${list.map(c => `<li><span><b>${escH(c.name)}</b> \u00b7 ${t.withT} ${escH(c.teacher)}</span><button class="lnk" data-leave="${escH(c.id)}">${t.leave}</button></li>`).join("")}</ul>` : `<p class="note2">${t.noClasses}</p>`}
    <div class="form"><b style="font-size:15px">${t.joinT}</b><label>${t.joinCode}<input id="cCode" dir="ltr" autocapitalize="characters" autocomplete="off" maxlength="9"></label>
    <div class="err" id="cErr"></div><p id="cQ" hidden></p><button class="btn" id="cGo">${t.check}</button><div class="links"><button id="cBack">${t.back}</button></div></div>`;
  $("cBack").addEventListener("click", acctMenu);
  let found = null;
  $("cCode").addEventListener("input", () => { found = null; $("cQ").hidden = true; $("cGo").textContent = t.check; });
  $("cGo").addEventListener("click", async () => {
    $("cErr").textContent = "";
    try {
      if (!found) { found = await EDU.classes.info($("cCode").value); $("cQ").textContent = t.joinQ(found.name, found.teacher); $("cQ").hidden = false; $("cGo").textContent = t.joinBtn; return; }
      await EDU.classes.join($("cCode").value); myClasses();
    } catch (e) { $("cErr").textContent = e.message; found = null; }
  });
  box.querySelectorAll("[data-leave]").forEach(b => b.addEventListener("click", async () => {
    if (b.textContent !== t.leaveQ) { b.textContent = t.leaveQ; return; }
    try { await EDU.classes.leave(b.dataset.leave); myClasses(); } catch (e) { $("cErr").textContent = e.message; }
  }));
}
$("acctBtn").addEventListener("click", acctMenu);
const _render = render;
render = function () { _render(); renderAccount(); };
render();
EDU.refresh().then(() => { render(); if (!EDU.user && !load("edu_guest", false)) welcome("choose"); });
</script>
