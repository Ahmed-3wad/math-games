<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#051C54">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Math Games">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="apple-touch-icon" href="../icon-180.png">
<link rel="icon" href="../icon-192.png">
<script>window.HUB_URL = "../";</script>
<title>Minute Challenge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
/* ================= shared look for every game (night-sky navy + gold) ================= */
:root{
  --deep:#020B26; --stage:#051C54; --panel:#0E2C74; --silver:#C9D3EA; --muted:#8C9AC0;
  --gold:#FCA500; --gold-dark:#8A5A00; --green:#2F9E6E; --green-hi:#3DC48A; --coral:#ED4667; --teal:#108CB5; --ink:#051C54;
  --display:"Arial Rounded MT Bold","Nunito","Segoe UI",sans-serif;
  --body:"Segoe UI","Nunito",Tahoma,sans-serif;
  --cut:clamp(12px,1.6vw,24px);
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--deep);color:#fff;font-family:var(--body);overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.app{position:relative;min-height:100%;display:flex;flex-direction:column;
  background:radial-gradient(ellipse 70% 75% at 40% 30%,#1B3F8F 0%,#0A2466 38%,var(--stage) 68%,var(--deep) 100%);
  padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
.rays{position:absolute;inset:0;pointer-events:none;background:repeating-conic-gradient(from 0deg at 40% 30%,rgba(255,255,255,.035) 0 6deg,transparent 6deg 14deg)}
.screen{position:relative;flex:1;display:flex;flex-direction:column;gap:clamp(10px,1.6vw,20px);max-width:1400px;width:100%;margin:0 auto;box-sizing:border-box;padding-block:clamp(10px,1.6vw,22px) 24px;padding-inline:16px}

/* top bar */
.topbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;min-height:46px;padding-left:58px}
.menu-btn{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);left:calc(env(safe-area-inset-left,0px) + 14px);z-index:25;width:46px;height:46px;border-radius:12px;border:1.5px solid rgba(201,211,234,.6);background:rgba(2,11,38,.7);display:grid;place-items:center;padding:0;flex:none}
.menu-btn:hover{border-color:var(--gold)}
.menu-btn svg{width:24px;height:24px}
.chip{border:2px solid var(--gold);color:var(--gold);border-radius:99px;padding:4px 14px;font-family:var(--display);font-size:clamp(13px,1.2vw,17px);white-space:nowrap}
.chip.solid{background:var(--gold);color:var(--ink)}
.spacer{flex:1}
.icon-btn{background:rgba(2,11,38,.55);border:1.5px solid rgba(201,211,234,.5);border-radius:10px;padding:6px 12px;font-size:14px}
.icon-btn:hover{border-color:var(--gold)}

/* headings */
.kicker{font-family:var(--display);letter-spacing:.3em;color:var(--silver);font-size:clamp(13px,1.6vw,22px);text-align:center}
.logo-type{font-family:var(--display);font-size:clamp(38px,7.5vw,104px);line-height:1;color:var(--gold);text-shadow:0 .06em 0 var(--gold-dark),0 0 .5em rgba(252,165,0,.45);margin:0;text-align:center;text-wrap:balance}
.sub{color:var(--silver);font-size:clamp(14px,1.5vw,20px);max-width:62ch;text-align:center;margin:0 auto;line-height:1.5}
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(12px,1.8vw,24px)}
.card{background:rgba(2,11,38,.6);border:1.5px solid rgba(201,211,234,.4);border-radius:16px;padding:clamp(14px,2vw,24px);width:min(900px,100%);box-sizing:border-box}
.card h2{font-family:var(--display);color:var(--gold);font-size:clamp(16px,1.5vw,21px);margin:0 0 10px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:6px 0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:clamp(14px,2vw,26px)}
.lsum{display:flex;align-items:center;gap:8px;flex-wrap:wrap;color:var(--silver);font-size:14px;line-height:1.5}
input[type=text]{background:var(--stage);border:1.5px solid rgba(201,211,234,.5);border-radius:8px;color:#fff;padding:7px 10px;font:inherit;min-width:0;width:100%;box-sizing:border-box}
select{background:var(--stage);border:1.5px solid rgba(201,211,234,.5);border-radius:8px;color:#fff;padding:6px 8px;font:inherit}
label.chk{display:flex;gap:8px;align-items:flex-start;padding:4px 0;cursor:pointer;line-height:1.35}
label.chk input{margin-top:3px;accent-color:var(--gold);width:17px;height:17px;flex:none}
.seg{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.seg button{text-align:left;border:2px solid rgba(201,211,234,.4);background:rgba(2,11,38,.45);border-radius:14px;padding:10px 14px;display:flex;flex-direction:column;gap:3px}
.seg button b{font-family:var(--display);font-size:17px}
.seg button span{font-size:13px;color:var(--silver);line-height:1.4}
.seg button[aria-pressed="true"]{border-color:var(--gold);background:rgba(252,165,0,.14)}
.seg button[aria-pressed="true"] b{color:var(--gold)}

/* buttons */
.btn{font-family:var(--display);font-size:clamp(15px,1.4vw,21px);border-radius:99px;padding:.6em 1.6em;border:2px solid var(--gold);background:var(--gold);color:var(--ink)}
.btn:hover:not(:disabled){filter:brightness(1.1)}
.btn:disabled{opacity:.35;cursor:default}
.btn.ghost{background:transparent;color:var(--gold)}
.btn.green{background:var(--green);border-color:var(--green-hi);color:#fff}
.bar{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;align-items:center}

/* question + answers */
.lz{position:relative;clip-path:polygon(var(--cut) 0,calc(100% - var(--cut)) 0,100% 50%,calc(100% - var(--cut)) 100%,var(--cut) 100%,0 50%);background:linear-gradient(var(--silver),#8FA0C8);padding:3px}
.lz>.in{clip-path:inherit;background:linear-gradient(#123480,var(--stage) 60%,#03133E);display:flex;align-items:center;padding:clamp(8px,1vw,16px) calc(var(--cut) + 14px);min-height:100%;box-sizing:border-box}
.q .in{flex-direction:column;justify-content:center;text-align:center;font-family:var(--display);font-size:clamp(18px,2.3vw,36px);line-height:1.35;min-height:clamp(90px,10vw,160px);text-wrap:balance}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:clamp(8px,1vw,14px) clamp(10px,1.4vw,22px)}
.opt{border:0;padding:3px;text-align:left}
.opt .in{font-family:var(--display);font-size:clamp(15px,1.8vw,28px);min-height:clamp(50px,5vw,76px);gap:.6em;font-variant-numeric:tabular-nums;line-height:1.25}
.opt .let{color:var(--gold)}
.opt:hover:not(:disabled) .in{background:linear-gradient(#1C46A3,#0A2466)}
.opt:disabled{cursor:default}
.opt.right{background:#E8FFF2}.opt.right .in{background:linear-gradient(var(--green-hi),var(--green) 60%,#1F7A52);color:#fff}.opt.right .let{color:#fff}
.opt.wrong{background:#FFD0DA}.opt.wrong .in{background:linear-gradient(#F26A86,var(--coral) 60%,#B8264A);color:#fff}.opt.wrong .let{color:#fff}
.opt.pick{background:#FFE7B0}.opt.pick .in{background:linear-gradient(#FFB733,#E48F00);color:var(--ink)}.opt.pick .let{color:var(--ink)}
.explain{background:rgba(2,11,38,.68);border-left:6px solid var(--green);border-radius:10px;padding:12px 18px;font-size:clamp(14px,1.35vw,20px);line-height:1.55}
.explain.bad{border-left-color:var(--coral)}
.explain b.ok{color:var(--green-hi)} .explain b.no{color:#FF8FA6}
.why{display:flex;flex-direction:column;gap:2px;margin-bottom:8px}
.steps-more summary{cursor:pointer;color:var(--gold);font-family:var(--display);font-size:.9em}
.steps-more ol{margin:6px 0 0;padding-left:1.4em;line-height:1.55;font-size:.92em;color:var(--silver)}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;font-size:.72em;line-height:1.05;margin:0 .12em}
.fr>span:first-child{border-bottom:.12em solid currentColor;padding:0 .2em}
.qfig{display:block;margin:.4em auto 0;height:clamp(90px,13vw,170px);width:auto;max-width:100%}

/* drawer menu */
.scrim{position:fixed;inset:0;background:rgba(2,11,38,.6);z-index:39}
.drawer{position:fixed;top:0;bottom:0;left:0;width:min(360px,88vw);z-index:40;background:var(--stage);border-right:2px solid rgba(201,211,234,.5);
  padding:calc(env(safe-area-inset-top,0px) + 16px) 16px 20px;box-sizing:border-box;overflow-y:auto;display:flex;flex-direction:column;gap:6px;box-shadow:8px 0 30px rgba(0,0,0,.5)}
.drawer-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.drawer-head b{font-family:var(--display);color:var(--gold);font-size:22px}
.x{width:38px;height:38px;border-radius:10px;border:1.5px solid rgba(201,211,234,.5);background:transparent;font-size:22px;line-height:1}
.mitem{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:rgba(2,11,38,.45);border:1.5px solid transparent;border-radius:12px;padding:12px 14px;font-family:var(--display);font-size:16px;box-sizing:border-box;text-decoration:none;color:#fff}
.mitem:hover{border-color:rgba(252,165,0,.6)}
.mitem small{font-family:var(--body);color:var(--muted);font-size:12px;margin-left:auto}
.mitem:disabled{opacity:.5;cursor:default}
.mitem:disabled:hover{border-color:transparent}
.mitem.on{border-color:rgba(252,165,0,.6)}
.mitem .dot{width:9px;height:9px;border-radius:50%;background:var(--gold);flex:none}
.mitem.home{color:var(--gold)}
.mgroup{font-family:var(--display);color:var(--muted);font-size:12px;letter-spacing:.12em;margin:12px 4px 2px}
.lessons{background:rgba(2,11,38,.45);border-radius:12px;padding:8px 12px;margin-left:12px}
.lessons .row{justify-content:space-between;margin:0 0 4px}
.lessons .link{background:none;border:0;color:var(--gold);font-size:13px;padding:2px 4px;text-decoration:underline}
.lessons label.chk{font-size:14px}
.tag{display:inline-block;font-family:var(--display);background:var(--teal);border-radius:6px;padding:0 6px;margin-right:4px;font-size:.85em;color:#fff}
.mnote{color:var(--muted);font-size:12px;margin:4px 2px 0 14px;line-height:1.4}

.overlay{position:fixed;inset:0;background:rgba(2,11,38,.82);display:grid;place-items:center;padding:16px;z-index:30}
.modal{background:var(--stage);border:2px solid var(--silver);border-radius:18px;padding:clamp(16px,2.4vw,30px);width:min(640px,100%);box-sizing:border-box;text-align:center;max-height:calc(100vh - 32px);overflow-y:auto}
.modal h3{font-family:var(--display);color:var(--gold);font-size:clamp(20px,2.2vw,28px);margin:0 0 8px}
.big{font-family:var(--display);font-size:clamp(34px,6vw,84px);color:var(--gold);font-variant-numeric:tabular-nums;line-height:1}
canvas.confetti{position:fixed;inset:0;pointer-events:none;z-index:50}

@media (max-width:820px){ .grid2{grid-template-columns:1fr} }
@media (max-width:540px){ .opts{grid-template-columns:1fr} }
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* Minute Challenge: the clock is the hero &#x2014; a ring that drains, the score beside it, one question at a time. */
.ring{position:relative;width:clamp(150px,20vw,230px);aspect-ratio:1;max-width:100%}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .num{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-size:clamp(46px,6vw,76px);color:var(--gold);font-variant-numeric:tabular-nums}
.hud{display:flex;align-items:center;justify-content:center;gap:clamp(14px,3vw,40px);flex-wrap:wrap}
.mini-ring{width:clamp(84px,9vw,120px)}
.mini-ring .num{font-size:clamp(28px,3.2vw,44px)}
.stat{display:flex;flex-direction:column;align-items:center;gap:2px}
.stat b{font-family:var(--display);font-size:clamp(30px,4vw,54px);font-variant-numeric:tabular-nums;line-height:1}
.stat span{color:var(--muted);font-size:13px;letter-spacing:.12em;font-family:var(--display)}
.stat.streak b{color:var(--coral)}
.flash-ok{animation:ok .35s}
.flash-no{animation:no .35s}
@keyframes ok{50%{box-shadow:0 0 0 6px rgba(61,196,138,.6)}}
@keyframes no{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.best{font-family:var(--display);color:var(--silver);font-size:clamp(15px,1.5vw,19px)}
.best b{color:var(--gold)}
.misses{width:min(900px,100%);display:flex;flex-direction:column;gap:10px}
.miss{background:rgba(2,11,38,.6);border:1.5px solid rgba(201,211,234,.3);border-radius:12px;padding:10px 14px;line-height:1.5;font-size:clamp(14px,1.3vw,17px)}
.miss .mq{font-family:var(--display);margin-bottom:4px}
.miss .mq .qfig{height:90px;margin:4px 0}
.record{font-family:var(--display);color:var(--coral);font-size:clamp(18px,2vw,26px);animation:pulse 1s 3}
@keyframes pulse{50%{transform:scale(1.08)}}
</style>
</head>
<body>

<div class="app">
  <div class="rays"></div>

  <section class="screen" id="scrStart">
    <div class="topbar"><span class="spacer"></span></div>
    <div class="center">
      <div class="kicker">HOW MANY CAN YOU SOLVE?</div>
      <h1 class="logo-type">MINUTE CHALLENGE</h1>
      <div class="ring" id="startRing"></div>
      <p class="sub">Answer as many questions as you can before the clock runs out. Questions get harder as your score grows. At the end you can review every mistake.</p>
      <div class="best" id="bestLine"></div>
      <div class="card" style="width:min(640px,100%)">
        <div class="lsum"><span id="lessonSum"></span><button class="btn ghost" id="btnLessons" style="font-size:13px;padding:.35em 1em">Change in the menu</button></div>
        <div class="row" style="margin-top:8px"><label for="secs">Time</label><select id="secs"><option value="30">30 seconds</option><option value="60" selected>60 seconds</option><option value="90">90 seconds</option><option value="120">2 minutes</option></select></div>
      </div>
      <div class="bar"><button class="btn" id="btnGo">Start!</button></div>
    </div>
  </section>

  <section class="screen" id="scrPlay" hidden>
    <div class="topbar"><span class="chip" id="qLesson"></span><span class="spacer"></span></div>
    <div class="hud">
      <div class="stat"><b id="score">0</b><span>CORRECT</span></div>
      <div class="ring mini-ring" id="playRing"></div>
      <div class="stat streak"><b id="streak">0</b><span>IN A ROW</span></div>
    </div>
    <div id="qBox"></div>
    <div class="explain bad" id="quick" hidden></div>
  </section>

  <section class="screen" id="scrEnd" hidden>
    <div class="topbar"><span class="spacer"></span></div>
    <div class="center">
      <div class="kicker">TIME'S UP!</div>
      <div class="big"><span id="endScore">0</span> correct</div>
      <div class="record" id="record" hidden>New personal best!</div>
      <div class="best" id="endLine"></div>
      <div class="bar"><button class="btn" id="btnAgain">Play again</button><button class="btn ghost" id="btnHome">Change settings</button></div>
      <h2 style="font-family:var(--display);color:var(--gold);margin:8px 0 0" id="missHead">Review your mistakes</h2>
      <div class="misses" id="misses"></div>
    </div>
  </section>
</div>

<script>
const IMG = {};
/* ================= engine core: shared helpers for every grade ================= */
// Every question carries:
//   options/correct/explain  - the four choices and a short solution line
//   reasons[i]               - why choice i is wrong (shown after a wrong answer)
//   steps                    - thinking steps WITHOUT the answer (used by the home-mode AI helpers)
const R = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = R(0, i); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const fmt = n => n.toLocaleString("en-US");
const cap = s => s[0].toUpperCase() + s.slice(1);
const P10 = k => 10 ** k;
const PLACE = ["ones", "tens", "hundreds", "thousands", "ten thousands", "hundred thousands", "millions"];
const PLACE1 = ["one", "ten", "hundred", "thousand", "ten thousand", "hundred thousand", "million"];
// A stacked fraction (never a slash): FR(1, 10)
const FR = (n, d) => `<span class="fr"><span>${n}</span><span>${d}</span></span>`;
// Decimals are kept as whole numbers of thousandths (m) to avoid floating-point errors; p = digits after the point.
const DPLACE = ["", "tenths", "hundredths", "thousandths"];
const fmtDec = (m, p) => { const w = Math.floor(m / 1000), f = m % 1000; return p ? `${fmt(w)}.${String(f).padStart(3, "0").slice(0, p)}` : fmt(w); };
function decWords(m, p) {
  const w = Math.floor(m / 1000), f = Math.round((m % 1000) / P10(3 - p));
  const frac = f ? `${w3(f)} ${DPLACE[p].replace(/s$/, f === 1 ? "" : "s")}` : "";
  return w ? (frac ? `${words(w)} and ${frac}` : words(w)) : frac;
}
const digitsOf = n => String(n).split("").reverse().map(Number);           // [ones, tens, \u2026]
const fromDigits = d => Number(d.slice().reverse().join(""));
const randN = len => R(P10(len - 1), P10(len) - 1);
const nth = k => ["1st", "2nd", "3rd", "4th", "5th", "6th"][k];

const ONES = ["zero","one","two","three","four","five","six","seven","eight","nine","ten","eleven","twelve","thirteen","fourteen","fifteen","sixteen","seventeen","eighteen","nineteen"];
const TENS = ["","","twenty","thirty","forty","fifty","sixty","seventy","eighty","ninety"];
function w3(n) {
  const h = Math.floor(n / 100), r = n % 100, out = [];
  if (h) out.push(ONES[h] + " hundred");
  if (r) out.push(r < 20 ? ONES[r] : TENS[Math.floor(r / 10)] + (r % 10 ? "-" + ONES[r % 10] : ""));
  return out.join(" ");
}
function words(n) {
  if (n === 1e6) return "one million";
  const th = Math.floor(n / 1000), r = n % 1000;
  return [th ? w3(th) + " thousand" : "", r ? w3(r) : ""].filter(Boolean).join(", ");
}

// Generic reason for a wrong number: how far off it is, and in which place.
function offBy(wrong, right) {
  const d = Math.abs(wrong - right), k = Math.round(Math.log10(d));
  if (P10(k) === d && k <= 5) return `This is ${fmt(d)} too ${wrong > right ? "big" : "small"}. Check the ${PLACE[k]} place again.`;
  return `This is ${fmt(d)} ${wrong > right ? "more" : "less"} than the correct answer. Check each place again.`;
}

// Build a question. cands = wrong answers in priority order, each a value or [value, reason].
function makeQ(lesson, text, ans, cands, explain, steps, show = fmt) {
  const key = v => (typeof v === "number" ? fmt(v) : v);
  const seen = new Set([key(ans)]), wrong = [];
  for (const raw of cands) {
    if (wrong.length === 3) break;
    const [c, why] = Array.isArray(raw) ? raw : [raw, null];
    if (c === null || c === undefined || (typeof c === "number" && (c <= 0 || !Number.isInteger(c) || (ans < 1e6 && c >= 1e6)))) continue;
    if (seen.has(key(c))) continue;
    seen.add(key(c)); wrong.push([c, why]);
  }
  for (let k = 0; wrong.length < 3 && typeof ans === "number" && k < 40; k++) {   // fallback: nudge one place
    const c = ans + pick([-1, 1]) * P10(R(0, Math.max(1, String(ans).length - 2)));
    if (c > 0 && !seen.has(key(c))) { seen.add(key(c)); wrong.push([c, null]); }
  }
  // fallback for answers like "16 cubic units" or "35.929": change the number, keep the words
  const nm = typeof ans === "string" && ans.match(/^(\d[\d,]*)(\.\d+)?([^\d]*)$/);
  for (let k = 0; wrong.length < 3 && nm && k < 40; k++) {
    if (nm[2]) {                                           // decimal: change one decimal digit
      const dec = nm[2].slice(1), i = R(0, dec.length - 1), d = (+dec[i] + pick([1, 2, 8, 9])) % 10;
      const c = `${nm[1]}.${dec.slice(0, i)}${d}${dec.slice(i + 1)}${nm[3] || ""}`;
      if (!seen.has(c)) { seen.add(c); wrong.push([c, `Check the ${DPLACE[i + 1]} digit again.`]); }
    } else {
      const n = Number(nm[1].replace(/,/g, "")), c0 = pick([n + 1, n - 1, n * 2, n + 10, n - 2, n + 2]);
      const c = `${fmt(c0)}${nm[3] || ""}`;
      if (c0 > 0 && !seen.has(c)) { seen.add(c); wrong.push([c, `${fmt(c0)} is not right. ${offBy(c0, n)}`]); }
    }
  }
  const opts = shuffle([[ans, null], ...wrong]);
  return {
    lesson, text, explain, steps,
    options: opts.map(([o]) => (typeof o === "number" ? show(o) : o)),
    correct: opts.findIndex(([o]) => o === ans),

// 15 questions, easy \u2192 hard (tier 1 = Q1\u20135, 2 = Q6\u201310, 3 = Q11\u201315), no lesson twice in a row.
function makeRound(grade, lessons) {

    let k = bag.findIndex(l => l !== last); if (k < 0) k = 0;

const ringSvg = (frac, low) => `<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="44" fill="#051C54" stroke="rgba(201,211,234,.2)" stroke-width="9"/><circle cx="50" cy="50" r="44" fill="none" stroke="${low ? "#ED4667" : "#FCA500"}" stroke-width="9" stroke-linecap="round" stroke-dasharray="${(276.5 * frac).toFixed(1)} 276.5"/></svg>`;
const setRing = (el, frac, label, low) => { el.innerHTML = ringSvg(frac, low) + `<div class="num">${label}</div>`; };
const bestKey = () => `minute_best_${KIT.grade}_${$("secs").value}`;
let G = null, timer = null;

function renderStart() {
  setRing($("startRing"), 1, $("secs").value);
  $("lessonSum").textContent = KIT.summary();
  const b = KIT.load(bestKey(), 0);
  $("bestLine").innerHTML = b ? `Your best (${GRADES[KIT.grade].name}, ${$("secs").value} s): <b>${b}</b>` : `No best score yet for ${GRADES[KIT.grade].name}. Set one!`;
}
$("secs").value = KIT.load("minute_secs", "60");
$("secs").addEventListener("change", () => { KIT.save("minute_secs", $("secs").value); renderStart(); });
$("btnLessons").addEventListener("click", () => KIT.toggle(true, true));
KIT.mountMenu({ onChange: renderStart, extra: [["Start again", () => { stop(); renderStart(); show("scrStart"); }]] });
function show(id) { ["scrStart", "scrPlay", "scrEnd"].forEach(s => ($(s).hidden = s !== id)); }

$("btnGo").addEventListener("click", start);
$("btnAgain").addEventListener("click", start);
$("btnHome").addEventListener("click", () => { renderStart(); show("scrStart"); });
function start() {
  const secs = +$("secs").value;
  G = { secs, left: secs, score: 0, streak: 0, best: 0, misses: [], busy: false };
  $("score").textContent = 0; $("streak").textContent = 0; $("quick").hidden = true;
  show("scrPlay"); next(); tickRing();
  clearInterval(timer);
  timer = setInterval(() => {
    if (KIT.menuOpen()) return;                       // paused while the menu is open
    G.left--; tickRing();
    if (G.left <= 5 && G.left > 0) KIT.sfx.tick();
    if (G.left <= 0) end();
  }, 1000);
}
const stop = () => clearInterval(timer);
const tickRing = () => setRing($("playRing"), G.left / G.secs, G.left, G.left <= 10);
const tier = () => (G.score < 5 ? 1 : G.score < 10 ? 2 : 3);
function next() {
  G.q = KIT.nextQuestion(tier()); G.busy = false;
  $("qLesson").textContent = `${GRADES[KIT.grade].name} \u00b7 Lesson ${G.q.lesson}`;
  KIT.showQuestion($("qBox"), G.q, answer);
}
function answer(i) {
  if (G.busy || G.left <= 0 || i < 0) return;
  G.busy = true;
  const ok = i === G.q.correct, box = $("qBox");
  KIT.mark(box, G.q, i);
  if (ok) {
    G.score++; G.streak++; G.best = Math.max(G.best, G.streak); KIT.sfx.right();
    box.classList.remove("flash-ok"); void box.offsetWidth; box.classList.add("flash-ok");
    $("quick").hidden = true; setTimeout(next, 450);
  } else {
    G.streak = 0; KIT.sfx.wrong(); G.misses.push({ q: G.q, sel: i });
    box.classList.remove("flash-no"); void box.offsetWidth; box.classList.add("flash-no");
    $("quick").hidden = false; $("quick").innerHTML = `<b class="no">Not quite.</b> ${G.q.reasons[i]}`;
    setTimeout(next, 1600);
  }
  $("score").textContent = G.score; $("streak").textContent = G.streak;
}
KIT.keys(i => { if (!$("scrPlay").hidden) answer(i); });
function end() {
  stop(); G.left = 0;
  const key = bestKey(), prev = KIT.load(key, 0), rec = G.score > prev;
  if (rec) KIT.save(key, G.score);
  $("endScore").textContent = G.score; $("record").hidden = !rec || G.score === 0;
  const tried = G.score + G.misses.length;
  $("endLine").innerHTML = `Answered ${tried} \u00b7 accuracy ${tried ? Math.round(G.score / tried * 100) : 0}% \u00b7 longest streak ${G.best} \u00b7 best <b>${Math.max(prev, G.score)}</b>`;
  $("missHead").textContent = G.misses.length ? `Review your mistakes (${G.misses.length})` : "No mistakes. Excellent!";
  $("misses").innerHTML = G.misses.map(m => `<div class="miss"><div class="mq">${m.q.text}</div>${KIT.explain(m.q, m.sel)}</div>`).join("");
  show("scrEnd");
  if (rec && G.score) { KIT.confetti(); KIT.sfx.win(); }
}
renderStart();
</script>

<script>if ("serviceWorker" in navigator) navigator.serviceWorker.register("../sw.js").catch(() => {});</script>
</body>
</html>
